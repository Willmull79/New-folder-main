        // Fantasy API Service
        class FantasyAPIService {
            constructor() {
                this.cache = new Map();
                this.cacheTimeout = 5 * 60 * 1000; // 5 minutes
                this.baseUrl = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl';
            }

            async fetchWithCache(url, cacheKey) {
                const cached = this.cache.get(cacheKey);
                if (cached && Date.now() - cached.timestamp < this.cacheTimeout) {
                    return cached.data;
                }

                try {
                    const response = await fetch(url);
                    const data = await response.json();
                    this.cache.set(cacheKey, { data, timestamp: Date.now() });
                    return data;
                } catch (error) {
                    console.error(`API Error for ${url}:`, error);
                    throw new Error(`Failed to fetch data: ${error.message}`);
                }
            }

            async getLiveScores() {
                try {
                    const data = await this.fetchWithCache(`${this.baseUrl}/scoreboard`, 'liveScores');
                    
                    if (!data.events) {
                        return [];
                    }

                    return data.events.map(game => ({
                        homeTeam: game.competitions[0]?.competitors?.find(c => c.homeAway === 'home')?.team?.name || 'TBD',
                        awayTeam: game.competitions[0]?.competitors?.find(c => c.homeAway === 'away')?.team?.name || 'TBD',
                        homeScore: game.competitions[0]?.competitors?.find(c => c.homeAway === 'home')?.score || '0',
                        awayScore: game.competitions[0]?.competitors?.find(c => c.homeAway === 'away')?.score || '0',
                        status: game.status?.type?.description || 'Unknown',
                        quarter: game.status?.type?.shortDetail || '',
                        time: game.status?.type?.description === 'In Progress' ? game.status?.displayClock || '' : ''
                    }));
                } catch (error) {
                    console.error('Error fetching live scores:', error);
                    return [];
                }
            }

            async getNFLPlayers() {
                try {
                    console.log('Fetching NFL players from:', `${this.baseUrl}/athletes`);
                    const data = await this.fetchWithCache(`${this.baseUrl}/athletes`, 'nflPlayers');
                    
                    console.log('Raw API response:', data);
                    
                    if (!data.athletes) {
                        console.log('No athletes found in API response');
                        return [];
                    }

                    return data.athletes.map(player => ({
                        id: player.id,
                        name: player.fullName,
                        position: player.position?.abbreviation || 'N/A',
                        nflTeam: player.team?.name || 'FA',
                        jerseyNumber: player.jersey || 'N/A',
                        height: player.height || 'N/A',
                        weight: player.weight || 'N/A',
                        age: player.age || 'N/A',
                        experience: player.experience || 'N/A',
                        college: player.college?.name || 'N/A',
                        status: player.status?.name || 'Active',
                        // Add fantasy-relevant stats
                        fantasyPoints: 0,
                        salary: Math.floor(Math.random() * 50) + 1, // Random salary for now
                        isRostered: false
                    }));
                } catch (error) {
                    console.error('Error fetching NFL players:', error);
                    return [];
                }
            }

            async getPlayerStats(playerId) {
                try {
                    const data = await this.fetchWithCache(`${this.baseUrl}/athletes/${playerId}/stats`, `playerStats_${playerId}`);
                    
                    if (!data.stats) {
                        return null;
                    }

                    // Extract relevant fantasy stats
                    const stats = data.stats;
                    let fantasyPoints = 0;
                    
                    // Calculate fantasy points based on position
                    if (stats.passing) {
                        fantasyPoints += stats.passing.yards * 0.04;
                        fantasyPoints += stats.passing.touchdowns * 4;
                        fantasyPoints -= stats.passing.interceptions * 2;
                    }
                    
                    if (stats.rushing) {
                        fantasyPoints += stats.rushing.yards * 0.1;
                        fantasyPoints += stats.rushing.touchdowns * 6;
                    }
                    
                    if (stats.receiving) {
                        fantasyPoints += stats.receiving.yards * 0.1;
                        fantasyPoints += stats.receiving.touchdowns * 6;
                    }

                    return {
                        fantasyPoints: Math.round(fantasyPoints * 100) / 100,
                        stats: stats
                    };
                } catch (error) {
                    console.error('Error fetching player stats:', error);
                    return null;
                }
            }

            getCacheStatus() {
                const now = Date.now();
                const status = {};
                
                for (const [key, value] of this.cache.entries()) {
                    const age = Math.round((now - value.timestamp) / 1000);
                    status[key] = `${age}s old`;
                }
                
                return status;
            }
        }

                        return;
                    }
                    newPartners = [...tradePartners, partnerId];
                }
                setTradePartners(newPartners);
                
                const newAssets = { ...tradeAssets };
                newPartners.forEach(id => {
                    if (!newAssets[id]) newAssets[id] = { players: [] };
                });
                Object.keys(newAssets).forEach(id => {
                    if (!newPartners.includes(id)) delete newAssets[id];
                });
                setTradeAssets(newAssets);
            };

            const handleAssetSelect = (teamId, playerId) => {
                const currentAssets = tradeAssets[teamId]?.players || [];
                const newAssets = { ...tradeAssets };
                if (currentAssets.includes(playerId)) {
                    newAssets[teamId].players = currentAssets.filter(p => p !== playerId);
                } else {
                    newAssets[teamId].players = [...currentAssets, playerId];
                }
                setTradeAssets(newAssets);
            };

            const calculateSalaries = useMemo(() => {
                const results = {};
                tradePartners.forEach(teamId => {
                    const team = teamDataMap[teamId];
                    if (!team) return;

                    const currentRosterPlayers = [ ...Object.values(team.roster.lineup), ...team.roster.bench, ...team.roster.ir ].filter(p => p);
                    const currentSalary = currentRosterPlayers.reduce((sum, pId) => sum + (playerDetailsMap[pId]?.salary || 0), 0);
                    
                    const sendingPlayers = tradeAssets[teamId]?.players || [];
                    const receivingPlayers = Object.entries(tradeAssets)
                        .filter(([id, _]) => id !== teamId)
                        .flatMap(([_, assets]) => assets.players);

                    const salaryOut = sendingPlayers.reduce((sum, pId) => sum + (playerDetailsMap[pId]?.salary || 0), 0);
                    const salaryIn = receivingPlayers.reduce((sum, pId) => sum + (playerDetailsMap[pId]?.salary || 0), 0);
                    
                    const newSalary = currentSalary - salaryOut + salaryIn;
                    results[teamId] = { currentSalary, newSalary, salaryIn, salaryOut };
                });
                return results;
            }, [tradeAssets, tradePartners, teamDataMap, playerDetailsMap]);

            const canProposeTrade = useMemo(() => {
                if (tradePartners.length < 2) return false;
                const totalAssets = Object.values(tradeAssets).flatMap(a => a.players).length;
                if (totalAssets === 0) return false;
                
                // Check for salary cap violations
                return Object.entries(calculateSalaries).every(([_, { newSalary }]) => newSalary <= salaryCap);
            }, [calculateSalaries, tradePartners, salaryCap]);
            
            const handleProposeTrade = async () => {
                if (!canProposeTrade) {
                    return showMessage("Trade is invalid. Check assets and salary caps.", "error");
                }
                setIsLoading(true);
                try {
                    const tradeData = {
                        initiatorId: userId,
                        teamIds: tradePartners,
                        assets: tradeAssets,
                        status: 'pending',
                        acceptances: { [currentTeamId]: true },
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    };
                    await db.collection(`leagues/${currentLeague.id}/trades`).add(tradeData);
                    showMessage("Trade proposed successfully!", "success");
                    setView('pending');
                    resetTrade();
                } catch (error) {
                    console.error("Error proposing trade:", error);
                    showMessage("Failed to propose trade.", "error");
                } finally {
                    setIsLoading(false);
                }
            };

            const handleTradeResponse = async (tradeId, response) => {
                const tradeRef = db.doc(`leagues/${currentLeague.id}/trades/${tradeId}`);
                setIsLoading(true);
                try {
                    if (response === 'accept') {
                        await tradeRef.update({ [`acceptances.${currentTeamId}`]: true });
                        const updatedTradeDoc = await tradeRef.get();
                        const trade = updatedTradeDoc.data();
                        
                        // Check if all parties have accepted
                        const allAccepted = trade.teamIds.every(id => trade.acceptances[id]);
                        
                        if (allAccepted) {
                            await executeTrade(trade, tradeRef);
                        } else {
                            showMessage("Trade accepted. Waiting for other teams.", "success");
                        }
                    } else { // Reject or Cancel
                        await tradeRef.update({ status: response === 'reject' ? 'rejected' : 'canceled' });
                        showMessage(`Trade ${response === 'reject' ? 'rejected' : 'canceled'}.`, "info");
                    }
                } catch (error) {
                    console.error("Error responding to trade:", error);
                    showMessage("An error occurred.", "error");
                } finally {
                    setIsLoading(false);
                }
            };
            
            const executeTrade = async (trade, tradeRef) => {
                showMessage("All teams accepted. Processing trade...", "info");
                const batch = db.batch();

                // Final salary cap check before execution
                for (const teamId of trade.teamIds) {
                    const team = teamDataMap[teamId];
                    const currentSalary = [ ...Object.values(team.roster.lineup), ...team.roster.bench, ...team.roster.ir ].filter(p => p).reduce((sum, pId) => sum + (playerDetailsMap[pId]?.salary || 0), 0);
                    const salaryOut = (trade.assets[teamId]?.players || []).reduce((sum, pId) => sum + (playerDetailsMap[pId]?.salary || 0), 0);
                    const salaryIn = Object.entries(trade.assets)
                        .filter(([id, _]) => id !== teamId)
                        .flatMap(([_, assets]) => assets.players)
                        .reduce((sum, pId) => sum + (playerDetailsMap[pId]?.salary || 0), 0);
                    
                    if (currentSalary - salaryOut + salaryIn > salaryCap) {
                        await tradeRef.update({ status: 'failed_salary_cap' });
                        showMessage(`Trade failed: ${team.teamName} would exceed the salary cap.`, "error");
                        return;
                    }
                }

                // Process roster updates
                trade.teamIds.forEach(teamId => {
                    const teamRef = db.doc(`artifacts/${appId}/public/data/teams/${teamId}`);
                    const team = teamDataMap[teamId];
                    const playersOut = trade.assets[teamId]?.players || [];
                    const playersIn = Object.entries(trade.assets)
                        .filter(([id, _]) => id !== teamId)
                        .flatMap(([_, assets]) => assets.players);
                    
                    let newRoster = JSON.parse(JSON.stringify(team.roster));

                    // Remove players from lineup or bench
                    playersOut.forEach(pId => {
                        Object.keys(newRoster.lineup).forEach(slot => {
                            if (newRoster.lineup[slot] === pId) {
                                newRoster.lineup[slot] = null;
                            }
                        });
                        newRoster.bench = newRoster.bench.filter(benchPId => benchPId !== pId);
                        newRoster.ir = newRoster.ir.filter(irPId => irPId !== pId);
                    });

                    // Add players to bench
                    newRoster.bench = [...newRoster.bench, ...playersIn];
                    
                    batch.update(teamRef, { roster: newRoster });
                });

                // Mark trade as complete
                batch.update(tradeRef, { status: 'completed' });
                
                await batch.commit();
                showMessage("Trade complete! Rosters updated.", "success");
            };

            const renderNewTrade = () => (
                <div className="bg-gray-700 p-6 rounded-lg">
                    <h3 className="text-2xl font-bold text-blue-400 mb-4">Propose a New Trade</h3>
                    {/* Partner Selection */}
                    <div className="mb-6">
                        <h4 className="text-lg font-semibold mb-2">Select Trade Partners (up to 2 others)</h4>
                        <div className="flex flex-wrap gap-2">
                            {teamsData.filter(t => t.id !== currentTeamId).map(team => (
                                <button key={team.id} onClick={() => handlePartnerSelect(team.id)} className={`px-4 py-2 rounded-md font-semibold ${tradePartners.includes(team.id) ? 'bg-green-600' : 'bg-gray-600 hover:bg-gray-500'}`}>
                                    {team.teamName}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Asset Selection */}
                    {tradePartners.length > 1 && (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {tradePartners.map(teamId => {
                                const team = teamDataMap[teamId];
                                const teamPlayers = [ ...Object.values(team.roster.lineup).filter(p => p), ...team.roster.bench, ...team.roster.ir ];
                                return (
                                    <div key={teamId} className="bg-gray-800 p-4 rounded-lg">
                                        <div className="flex items-center gap-3 mb-3 border-b border-gray-600 pb-2">
                                            <img src={team.avatarUrl || "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI0EwQUVCQiI+PHBhdGggZD0iTTEyIDJDNi44OCAyIDIgNi40OCAyIDEyczQuNDggMTAgMTAgMTAgMTAtNC40OCAxMC0xMFMxNy41MiAyIDEyIDJ6bTAgM2MxLjY2IDAgMyAxLjM0IDMgM3MtMS4zNCAzLTMgMy0zLTEuMzQtMy0zIDEuMzQtMyAzLTN6bTAgMTRjLTIuMDMgMC0zLjg0LS44Ny01LjE5LTIuMzJDOC4wMSAxNi4wMSA5LjkyIDE1IDEyIDE1czMuOTkgMS4wMSA1LjE5IDIuNjljLTEuMzYgMS40NC0zLjE2IDIuMzEtNS4xOSAyLjMxeiIvPjwvc3ZnPg=="} alt="Team Avatar" className="w-10 h-10 rounded-full object-cover"/>
                                            <h4 className="text-xl font-bold">{team.teamName}</h4>
                                        </div>
                                        <div className="max-h-60 overflow-y-auto pr-2">
                                        {teamPlayers.length > 0 ? teamPlayers.map(pId => {
                                            const player = playerDetailsMap[pId];
                                            return (
                                                <div key={pId} className="flex items-center justify-between py-1">
                                                    <label className="flex items-center cursor-pointer">
                                                        <input type="checkbox" checked={tradeAssets[teamId]?.players.includes(pId)} onChange={() => handleAssetSelect(teamId, pId)} className="form-checkbox h-5 w-5 bg-gray-700 border-gray-500 rounded text-blue-500 focus:ring-blue-500"/>
                                                        <span className="ml-3">{player.name} (${player.salary})</span>
                                                    </label>
                                                </div>
                                            );
                                        }) : <p className="text-gray-400">No players on roster.</p>}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                    
                    {/* Summary & Propose Button */}
                    {tradePartners.length > 1 && (
                         <div className="mt-8 p-6 bg-gray-800 rounded-lg">
                            <h3 className="text-2xl font-bold text-green-400 mb-4">Trade Summary & Salary Impact</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {Object.entries(calculateSalaries).map(([teamId, data]) => {
                                    const team = teamDataMap[teamId];
                                    const isOverCap = data.newSalary > salaryCap;
                                    return (
                                    <div key={teamId} className={`p-3 rounded ${isOverCap ? 'bg-red-900' : 'bg-gray-700'}`}>
                                        <p className="font-bold text-lg">{team.teamName}</p>
                                        <p>Current: ${data.currentSalary.toFixed(2)}</p>
                                        <p className={`font-bold ${isOverCap ? 'text-red-400' : 'text-green-400'}`}>New: ${data.newSalary.toFixed(2)}</p>
                                        <p className="text-xs text-gray-400">Cap: ${salaryCap}</p>
                                        {isOverCap && <p className="text-xs text-red-300 font-bold">Over Salary Cap!</p>}
                                    </div>
                                    );
                                })}
                            </div>
                            <button onClick={handleProposeTrade} disabled={!canProposeTrade || isLoading} className="mt-6 w-full px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-md shadow-lg transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                               {isLoading ? 'Proposing...' : 'Propose Trade'}
                            </button>
                            {!canProposeTrade && <p className="text-center text-red-400 text-sm mt-2">Cannot propose trade. Ensure at least one asset is selected and all teams are under the salary cap.</p>}
                        </div>
                    )}
                </div>
            );

            const renderPendingTrades = () => (
                 <div className="bg-gray-700 p-6 rounded-lg">
                    <h3 className="text-2xl font-bold text-yellow-400 mb-4">Pending & Past Trades</h3>
                    {isLoading ? <p>Loading trades...</p> : 
                    pendingTrades.length === 0 ? <p className="text-gray-400">You are not involved in any trades.</p> : (
                        <div className="space-y-6">
                            {pendingTrades.map(trade => {
                                const initiatorTeam = teamsData.find(t => t.ownerId === trade.initiatorId);
                                const isUserInitiator = trade.initiatorId === userId;
                                const userHasAccepted = trade.acceptances[currentTeamId];
                                return (
                                <div key={trade.id} className="bg-gray-800 p-4 rounded-lg shadow-md">
                                    <div className="flex justify-between items-center mb-4 border-b border-gray-600 pb-2">
                                        <h4 className="text-xl font-semibold">Trade with {trade.teamIds.filter(id => id !== currentTeamId).map(id => teamDataMap[id]?.teamName).join(', ')}</h4>
                                        <span className={`px-3 py-1 text-sm font-bold rounded-full ${
                                            {'pending': 'bg-yellow-500 text-gray-900', 'completed': 'bg-green-500 text-white', 'rejected': 'bg-red-500 text-white', 'canceled': 'bg-gray-500 text-white', 'failed_salary_cap': 'bg-red-700 text-white'}[trade.status]
                                        }`}>{trade.status.replace('_', ' ').toUpperCase()}</span>
                                    </div>

                                    {/* Assets View */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div className="bg-red-900/50 p-3 rounded">
                                            <h5 className="font-bold text-red-400">You Give:</h5>
                                            <ul className="list-disc list-inside text-sm mt-1">
                                                {(trade.assets[currentTeamId]?.players || []).map(pId => <li key={pId}>{playerDetailsMap[pId]?.name} (${playerDetailsMap[pId]?.salary})</li>)}
                                                {(trade.assets[currentTeamId]?.players || []).length === 0 && <li className="text-gray-400">Nothing</li>}
                                            </ul>
                                        </div>
                                        <div className="bg-green-900/50 p-3 rounded">
                                            <h5 className="font-bold text-green-400">You Receive:</h5>
                                            <ul className="list-disc list-inside text-sm mt-1">
                                                {Object.entries(trade.assets).filter(([id, _]) => id !== currentTeamId).flatMap(([_, assets]) => assets.players).map(pId => <li key={pId}>{playerDetailsMap[pId]?.name} (${playerDetailsMap[pId]?.salary})</li>)}
                                                {Object.entries(trade.assets).filter(([id, _]) => id !== currentTeamId).flatMap(([_, assets]) => assets.players).length === 0 && <li className="text-gray-400">Nothing</li>}
                                            </ul>
                                        </div>
                                    </div>

                                    {/* Acceptance Status & Actions */}
                                    <div className="mt-4 pt-2 border-t border-gray-600">
                                         <div className="text-xs text-gray-400 mb-2 flex flex-wrap gap-x-3 gap-y-1">
                                            <span>Acceptances:</span>
                                            {trade.teamIds.map(id => {
                                                const team = teamDataMap[id];
                                                return (
                                                    <span key={id} className={`flex items-center gap-1.5 ${trade.acceptances[id] ? 'text-green-400' : 'text-yellow-400'}`}>
                                                        <img src={team?.avatarUrl || "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI0EwQUVCQiI+PHBhdGggZD0iTTEyIDJDNi44OCAyIDIgNi40OCAyIDEyczQuNDggMTAgMTAgMTAgMTAtNC40OCAxMC0xMFMxNy41MiAyIDEyIDJ6bTAgM2MxLjY2IDAgMyAxLjM0IDMgM3MtMS4zNCAzLTMgMy0zLTEuMzQtMy0zIDEuMzQtMyAzLTN6bTAgMTRjLTIuMDMgMC0zLjg0LS44Ny01LjE5LTIuMzJDOC4wMSAxNi4wMSA5LjkyIDE1IDEyIDE1czMuOTkgMS4wMSA1LjE5IDIuNjljLTEuMzYgMS40NC0zLjE2IDIuMzEtNS4xOSAyLjMxeiIvPjwvc3ZnPg=="} alt={team?.teamName} className="w-4 h-4 rounded-full" />
                                                        {team?.teamName}
                                                        {trade.acceptances[id] ? ' ✔' : '  ...'}
                                                    </span>
                                                )
                                            })}
                                        </div>
                                        {trade.status === 'pending' && (
                                            <div className="flex gap-4 mt-2">
                                                {!userHasAccepted && <button onClick={() => handleTradeResponse(trade.id, 'accept')} disabled={isLoading} className="px-4 py-2 bg-green-600 hover:bg-green-700 rounded-md font-semibold">Accept</button>}
                                                {!userHasAccepted && <button onClick={() => handleTradeResponse(trade.id, 'reject')} disabled={isLoading} className="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-md font-semibold">Reject</button>}
                                                {isUserInitiator && <button onClick={() => handleTradeResponse(trade.id, 'cancel')} disabled={isLoading} className="px-4 py-2 bg-gray-600 hover:bg-gray-500 rounded-md font-semibold">Cancel</button>}
                                            </div>
                                        )}
                                    </div>
                                </div>
                                )
                            })}
                        </div>
                    )}
                </div>
            );

            return (
                 <div className="p-4 sm:p-6 bg-gray-800 rounded-lg shadow-xl max-w-7xl mx-auto my-8 text-white">
                    <h2 className="text-3xl font-bold text-white mb-6 text-center">Trade Center</h2>
                    <div className="flex justify-center border-b border-gray-600 mb-6">
                        <button onClick={() => setView('pending')} className={`px-4 sm:px-6 py-3 font-semibold ${view === 'pending' ? 'border-b-2 border-blue-400 text-white' : 'text-gray-400'}`}>Pending Trades</button>
                        <button onClick={() => { setView('new'); resetTrade(); }} className={`px-4 sm:px-6 py-3 font-semibold ${view === 'new' ? 'border-b-2 border-blue-400 text-white' : 'text-gray-400'}`}>Propose New Trade</button>
                    </div>
                    {view === 'new' ? renderNewTrade() : renderPendingTrades()}
                 </div>
            );
        };
        
        const Roster = ({ teamData, allPlayers, showMessage, currentLeague, handleLeaveLeague, onPlayerTransaction, currentTeamId }) => {
            const { db } = useFirebase();
            const [newTeamName, setNewTeamName] = useState(teamData.teamName || '');
            const [isSavingTeamName, setIsSavingTeamName] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [bidAmount, setBidAmount] = useState(1);
            const playerSelectRef = useRef(null);
            const rosterLimits = currentLeague?.settings?.rosterLimits || INITIAL_ROSTER_LIMITS;
            const isAuctionComplete = currentLeague?.auction?.status === 'complete';

            useEffect(() => {
                setNewTeamName(teamData.teamName || '');
            }, [teamData.teamName]);

            const handleUpdateTeamName = async () => {
                if (!db || !teamData?.id || !newTeamName.trim()) return showMessage("Team name cannot be empty.", "error");
                
                setIsSavingTeamName(true);
                const teamDocRef = db.doc(`artifacts/${appId}/public/data/teams/${teamData.id}`);
                try {
                    await teamDocRef.update({ teamName: newTeamName.trim() });
                    showMessage("Team name updated successfully!", "success");
                } catch (error) {
                    showMessage("Failed to update team name.", "error");
                } finally {
                    setIsSavingTeamName(false);
                }
            };

            const handlePlaceWaiverBid = async () => {
                if (!isAuctionComplete) {
                    return showMessage("You cannot add free agents until the auction is complete.", "error");
                }
                const playerId = playerSelectRef.current.value;
                if (!playerId) return showMessage("Please select a player.", "error");
                if (bidAmount <= 0) return showMessage("Bid must be greater than zero.", "error");

                const waiverRef = db.collection(`leagues/${currentLeague.id}/waivers`).doc(playerId);

                try {
                    const waiverDoc = await waiverRef.get();
                    if (waiverDoc.exists) {
                        return showMessage("This player is already on the waiver wire. Go to the Waiver Wire tab to bid.", "error");
                    }

                    const expiration = new Date();
                    expiration.setHours(expiration.getHours() + 24);

                    await waiverRef.set({
                        playerId: playerId,
                        bids: {
                            [currentTeamId]: Number(bidAmount)
                        },
                        highestBid: Number(bidAmount),
                        highestBidder: currentTeamId,
                        expiration: firebase.firestore.Timestamp.fromDate(expiration)
                    });

                    showMessage(`You have placed a bid of $${bidAmount} on ${getPlayerDetails(playerId, allPlayers).name}. The 24-hour auction has started.`, "success");
                    setBidAmount(1);

                } catch (error) {
                    showMessage("Error placing waiver bid.", "error");
                    console.error("Waiver bid error:", error);
                }
            };

            const handleRemovePlayer = async (playerId) => {
                if (!db || !teamData?.id) return;
                const playerToRemove = getPlayerDetails(playerId, allPlayers);
                if (!playerToRemove) return showMessage("Player not found.", "error");
                
                try {
                    const batch = db.batch();
                    const teamDocRef = db.doc(`artifacts/${appId}/public/data/teams/${teamData.id}`);
                    
                    const newRoster = JSON.parse(JSON.stringify(teamData.roster));
                    Object.keys(newRoster.lineup).forEach(slot => {
                        if (newRoster.lineup[slot] === playerId) {
                            newRoster.lineup[slot] = null;
                        }
                    });
                    newRoster.bench = newRoster.bench.filter(pId => pId !== playerId);
                    newRoster.ir = newRoster.ir.filter(pId => pId !== playerId);

                    batch.update(teamDocRef, { roster: newRoster });

                    if (currentLeague && currentLeague.id) {
                        const leagueDocRef = db.doc(`leagues/${currentLeague.id}`);
                        batch.update(leagueDocRef, {
                            allRosteredPlayerIds: firebase.firestore.FieldValue.arrayRemove(playerId)
                        });
                    }

                    await batch.commit();
                    showMessage(`${playerToRemove.name} dropped from your roster.`, "success");
                    onPlayerTransaction();
                } catch (error) {
                    showMessage("Error dropping player.", "error");
                    console.error("Error dropping player:", error);
                }
            };

            const handleMovePlayer = async (playerId, from, to) => {
                const newRoster = JSON.parse(JSON.stringify(teamData.roster));

                // Remove player from original spot
                if (from === 'bench') newRoster.bench = newRoster.bench.filter(pId => pId !== playerId);
                else if (from === 'ir') newRoster.ir = newRoster.ir.filter(pId => pId !== playerId);
                else newRoster.lineup[from] = null;

                // Add player to new spot
                if (to === 'bench') newRoster.bench.push(playerId);
                else if (to === 'ir') newRoster.ir.push(playerId);
                else newRoster.lineup[to] = playerId;

                try {
                    const teamDocRef = db.doc(`artifacts/${appId}/public/data/teams/${teamData.id}`);
                    await teamDocRef.update({ roster: newRoster });
                    showMessage("Roster updated.", "success");
                } catch(error) {
                    showMessage("Failed to update roster.", "error");
                }
            };

            const getEligibleSlotsForPlayer = (playerId) => {
                const playerDetails = getPlayerDetails(playerId, allPlayers);
                if (!playerDetails) return [];

                const pos = playerDetails.position;
                const emptySlots = Object.keys(teamData.roster.lineup).filter(slot => teamData.roster.lineup[slot] === null);
                
                return emptySlots.filter(slotKey => {
                    const slotPosition = slotKey.replace(/[0-9]/g, ''); // "RB1" -> "RB"
                    if (slotPosition === pos) return true;
                    if (slotPosition === 'Flex' && ['RB', 'WR', 'TE'].includes(pos)) return true;
                    if (slotPosition === 'DFlex' && ['DL', 'LB', 'DB'].includes(pos)) return true;
                    return false;
                });
            };

            const availablePlayers = getAvailablePlayers(currentLeague ? currentLeague.allRosteredPlayerIds : [], allPlayers)
                                             .filter(player => player.name.toLowerCase().includes(searchQuery.toLowerCase()));

            const PlayerActions = ({ playerId, from }) => {
                const [showDropdown, setShowDropdown] = useState(false);
                const eligibleSlots = getEligibleSlotsForPlayer(playerId);

                if (from === 'bench' || from === 'ir') {
                    if (eligibleSlots.length === 0) {
                        return <span className="text-xs text-gray-500">No open slots</span>;
                    }
                    return (
                        <div className="relative">
                            <button onClick={() => setShowDropdown(!showDropdown)} className="px-3 py-1 bg-green-600 hover:bg-green-700 text-white text-sm rounded-md">Start</button>
                            {showDropdown && (
                                <div className="absolute right-0 mt-2 w-48 bg-gray-600 rounded-md shadow-lg z-10">
                                    {eligibleSlots.map(slot => (
                                        <a key={slot} href="#" onClick={() => { handleMovePlayer(playerId, from.toLowerCase(), slot); setShowDropdown(false); }} className="block px-4 py-2 text-sm text-gray-200 hover:bg-blue-500">
                                            Move to {slot.replace(/(\d+)/, ' $1')}
                                        </a>
                                    ))}
                                </div>
                            )}
                        </div>
                    );
                } else { // It's a lineup slot

            const [password, setPassword] = useState('');
            const [username, setUsername] = useState('');
            const [isLoading, setIsLoading] = useState(false);

            const handleAuthAction = async () => {
                if (!auth || !db) return showMessage("Firebase not initialized.", "error");
                setIsLoading(true);
                try {
                    if (isLogin) {
                        await auth.signInWithEmailAndPassword(email, password);
                        showMessage("Logged in successfully!", "success");
                    } else {
                        if (!username.trim()) {
                            showMessage("Name cannot be empty.", "error");
                            setIsLoading(false);
                            return;
                        }
                        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                        const userProfileDocRef = db.doc(`artifacts/${appId}/users/${userCredential.user.uid}/userProfile/settings`);
                        await userProfileDocRef.set({ username }, { merge: true });
                        showMessage("Registered successfully!", "success");

                } catch (error) {
                    showMessage(error.message, "error");
                } finally {
                    setIsLoading(false);
                }

            const [userLeagues, setUserLeagues] = useState([]);
            const [isCreatingLeague, setIsCreatingLeague] = useState(false);

            useEffect(() => {
                if (!db || !userId) return;

                const unsubscribe = db.collection("artifacts").doc(appId).collection("public").doc("data").collection("teams")
                    .where("ownerId", "==", userId)
                    .onSnapshot(async (teamSnapshot) => {
                        const leagueIds = new Set();
                        teamSnapshot.forEach(doc => {
                            const teamData = doc.data();
                            if (teamData.leagueId) leagueIds.add(teamData.leagueId);
                        });

                        if (leagueIds.size === 0) {
                            setUserLeagues([]);
                            return;
                        }

                        const leagueDocs = await Promise.all(Array.from(leagueIds).map(id => db.doc(`leagues/${id}`).get()));
                        setUserLeagues(leagueDocs.filter(doc => doc.exists).map(doc => ({ id: doc.id, ...doc.data() })));
                    }, (error) => {
                        console.error("Error fetching user's leagues:", error);
                        showMessage("Error fetching your leagues.", "error");
                    });
                return () => unsubscribe();
            }, [db, userId]);

            const handleJoinLeague = async (leagueIdToJoin) => {
                if (!leagueIdToJoin.trim()) return showMessage("League ID cannot be empty.", "error");
                setIsLoadingJoin(true);
                
                const leagueDocRef = db.doc(`leagues/${leagueIdToJoin}`);
                const teamsCollectionRef = db.collection(`artifacts/${appId}/public/data/teams`);

                try {
                    const leagueDoc = await leagueDocRef.get();
                    if (!leagueDoc.exists) {
                        showMessage("League not found.", "error");
                        setIsLoadingJoin(false);
                        return;
                    }
                    const leagueData = leagueDoc.data();
                    const existingTeamQuery = await teamsCollectionRef.where("ownerId", "==", userId).where("leagueId", "==", leagueIdToJoin).get();

                    if (!existingTeamQuery.empty) {
                        const existingTeamId = existingTeamQuery.docs[0].id;
                        showMessage("You already have a team in this league. Entering now.", "info");
                        onLeagueSelected(leagueIdToJoin, existingTeamId);
                        return;
                    }

                    // Assign to a division round-robin style if divisions exist
                    const divisions = leagueData.settings.divisions || [];
                    let assignedDivision = null;
                    if (divisions.length > 0) {
                        const divisionIndex = leagueData.teams.length % divisions.length;
                        assignedDivision = divisions[divisionIndex];
                    }

                    const initialLineup = {};
                    const startingSlots = leagueData.settings.startingSlots || DEFAULT_STARTING_SLOTS;
                    Object.entries(startingSlots).forEach(([pos, count]) => {
                        for (let i = 1; i <= count; i++) {
                            initialLineup[`${pos}${i}`] = null;
                        }
                    });

                    const newTeamData = {
                        teamName: `${userDisplayName || 'New User'}'s Team`,
                        ownerId: userId,
                        leagueId: leagueIdToJoin,
                        roster: {
                            lineup: initialLineup,
                            bench: [],
                            ir: []
                        },
                        wins: 0, losses: 0, ties: 0,
                    };
                    if (assignedDivision) {
                        newTeamData.division = assignedDivision;
                    }

                    const newTeamRef = await teamsCollectionRef.add(newTeamData);

                    await leagueDocRef.update({
                        teams: firebase.firestore.FieldValue.arrayUnion(newTeamRef.id)
                    });

                    showMessage(`Successfully joined league "${leagueData.name}"!`, "success");
                    onLeagueSelected(leagueIdToJoin, newTeamRef.id);

                } catch (error) {
                    showMessage("Error joining league.", "error");
                    console.error(error);
                } finally {
                    setIsLoadingJoin(false);
                }
            };

                    userDisplayName={userDisplayName}
                    showMessage={showMessage}
                    onLeagueCreated={onLeagueSelected} 
                    onCancel={() => setIsCreatingLeague(false)}

                                        </div>
                                        <button onClick={() => handleJoinLeague(league.id)} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 font-semibold rounded-md flex-shrink-0">Enter</button>
                                    </li>
                                ))}
                            </ul>
                        </div>

                                {isLoadingJoin ? 'Joining...' : 'Join League'}

                        </div>
                    </div>

        const Standings = ({ currentLeague, showMessage, db, userId, teamsData }) => {

            const teamsMap = useMemo(() => teamsData.reduce((acc, team) => {
                acc[team.id] = team;
                return acc;
            }, {}), [teamsData]);

            useEffect(() => {
                setLeagueTeams(teamsData);

            const onSimulateWeek = async () => {
                if (!currentLeague || !currentLeague.teams || currentLeague.teams.length === 0) {
                    return showMessage("No teams in the league to simulate.", "error");
                }
                
                setIsSimulating(true);
                const batch = db.batch();
                for (const teamId of currentLeague.teams) {
                    const teamDocRef = db.doc(`artifacts/${appId}/public/data/teams/${teamId}`);
                    const outcome = Math.random();
                    if (outcome < 0.4) batch.update(teamDocRef, { wins: firebase.firestore.FieldValue.increment(1) });
                    else if (outcome < 0.8) batch.update(teamDocRef, { losses: firebase.firestore.FieldValue.increment(1) });
                    else batch.update(teamDocRef, { ties: firebase.firestore.FieldValue.increment(1) });
                }

                try {
                    await batch.commit();
                    showMessage("League week simulated!", "success");
                } catch (error) {
                    showMessage("Error simulating week.", "error");

                    setIsSimulating(false);

                const teamsCount = teamIds.length;
                const rounds = teamsCount - 1;

                const rotatingTeams = teamIds.slice(1);

                for (let week = 0; week < numWeeks; week++) {
                    const weeklyMatchups = [];
                    const firstTeam = teamIds[0];
                    
                    const matchup = { home: firstTeam, away: rotatingTeams[0] };
                    if (matchup.home !== "BYE" && matchup.away !== "BYE") {
                        weeklyMatchups.push(matchup);
                    }

                    for (let i = 1; i < teamsCount / 2; i++) {
                        const matchup = { home: rotatingTeams[i], away: rotatingTeams[teamsCount - 1 - i] };
                         if (matchup.home !== "BYE" && matchup.away !== "BYE") {
                            weeklyMatchups.push(matchup);
                        }
                    }

                    // Rotate the array for the next week

                try {

            const renderSchedule = () => {

                        </div>

                        <div className="space-y-4">
                            {matchupsForWeek.map((matchup, index) => {
                                const homeTeam = teamsMap[matchup.home];
                                const awayTeam = teamsMap[matchup.away];
                                if (!homeTeam || !awayTeam) return null;
                                return (
                                    <div key={index} className="bg-gray-700 p-4 rounded-lg flex items-center justify-center gap-4 text-center">
                                        <div className="flex-1 flex items-center gap-3 justify-end">
                                            <span className="font-semibold text-lg text-right">{awayTeam.teamName}</span>
                                            <img src={awayTeam.avatarUrl || defaultAvatar} alt="Away Team Avatar" className="w-10 h-10 rounded-full" />
                                        </div>
                                        <span className="text-gray-400 font-bold">@</span>
                                        <div className="flex-1 flex items-center gap-3">
                                            <img src={homeTeam.avatarUrl || defaultAvatar} alt="Home Team Avatar" className="w-10 h-10 rounded-full" />
                                            <span className="font-semibold text-lg text-left">{homeTeam.teamName}</span>
                                        </div>
                                    </div>
                                );
                            })}
                            {teamsWithBye.map(teamId => {
                                const byeTeam = teamsMap[teamId];
                                if (!byeTeam) return null;
                                return (
                                     <div key={teamId} className="bg-gray-700/50 p-4 rounded-lg text-center">
                                        <span className="font-semibold text-lg text-gray-400">{byeTeam.teamName} has a bye week.</span>
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                );
            };

            return (
                <div className="p-4 sm:p-6 bg-gray-800 rounded-lg shadow-xl max-w-4xl mx-auto my-8 text-white">
                    <div className="flex border-b border-gray-600 mb-6">
                        <button onClick={() => setActiveSubTab('standings')} className={`px-4 sm:px-6 py-3 font-semibold ${activeSubTab === 'standings' ? 'border-b-2 border-blue-400 text-white' : 'text-gray-400'}`}>Standings</button>
                        <button onClick={() => setActiveSubTab('schedule')} className={`px-4 sm:px-6 py-3 font-semibold ${activeSubTab === 'schedule' ? 'border-b-2 border-blue-400 text-white' : 'text-gray-400'}`}>Schedule</button>
                    </div>

                    {activeSubTab === 'standings' && (
                        <>
                            <h2 className="text-3xl font-bold text-white mb-6 text-center">League Standings</h2>
                            {leagueTeams.length > 0 ? (
                                divisions.length > 0 ? (
                                    divisions.map(divName => renderDivisionTable(divName))
                                ) : (
                                    renderDivisionTable('Overall Standings') // Fallback for leagues without divisions
                                )
                            ) : (
                                <p className="text-center text-gray-400">No teams in this league yet.</p>
                            )}
                            <div className="text-center mt-6">
                                <button onClick={onSimulateWeek} disabled={isSimulating || !currentLeague?.teams || currentLeague.teams.length === 0} className="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 font-bold rounded-md disabled:opacity-50 disabled:cursor-not-allowed">
                                    {isSimulating ? 'Simulating...' : 'Simulate Week'}

                        </>
                    )}

                    {activeSubTab === 'schedule' && (

                            <h2 className="text-3xl font-bold text-white mb-6 text-center">League Schedule</h2>
                            {isCommissioner && !currentLeague.schedule && (

                                        {isSimulating ? 'Generating...' : 'Generate Schedule'}
                                    </button>
                                </div>

                            {currentLeague.schedule && renderSchedule()}
                        </>
                    )}
                </div>

        const Auction = ({ currentLeague, userId, db, showMessage, teamsData }) => {

                    showMessage("Auction time has been set!", "success");
                } catch (error) {
                    showMessage("Failed to set auction time.", "error");
                    console.error("Error setting auction time:", error);

            const handleRandomizeOrder = async () => {

                const shuffledTeamIds = shuffleArray([...teamIds]);

                } catch (error) {
                    showMessage("Failed to set nomination order.", "error");
                    console.error("Error randomizing order:", error);
                }
            };
            
            const handleClearAuction = async () => {
                 const leagueDocRef = db.doc(`leagues/${currentLeague.id}`);
                 try {
                     await leagueDocRef.update({
                         "auction.auctionTime": firebase.firestore.FieldValue.delete(),
                         "auction.nominationOrder": firebase.firestore.FieldValue.delete(),
                         "auction.status": "pending",
                     });
                     showMessage("Auction settings cleared.", "success");
                 } catch(error) {
                     showMessage("Failed to clear auction settings.", "error");
                 }

            const handleStartAuction = async () => {

                    // Update league auction status and set initial nomination index

                    showMessage("Auction has started!", "success");
