            const [nominationPlayer, setNominationPlayer] = useState('');
            const [nominationAmount, setNominationAmount] = useState(1);
            const isCommissioner = currentLeague.commissionerId === userId;
            const currentTeam = teamsData.find(t => t.ownerId === userId);
            const isMyTurn = auctionState.currentBidder === currentTeam?.id;
            const canNominate = currentLeague.auction?.nominationOrder && 
                               currentLeague.auction.nominationOrder[currentLeague.auction.currentNominationIndex] === currentTeam?.id;

            // Listen to auction state changes
            useEffect(() => {
                if (!db || !currentLeague.id) return;
                
                const unsubscribe = db.doc(`leagues/${currentLeague.id}/auctionState`).onSnapshot(doc => {
                    if (doc.exists) {
                        setAuctionState(doc.data());
                    }
                });
                
                return () => unsubscribe();
            }, [db, currentLeague.id]);

            // Timer countdown
            useEffect(() => {
                if (!auctionState.isActive || auctionState.timeLeft <= 0) return;
                
                const timer = setInterval(async () => {
                    if (auctionState.timeLeft <= 1) {
                        // Time's up - award player to highest bidder
                        await handleAwardPlayer();
                    } else {
                        // Update timer
                        try {
                            await db.doc(`leagues/${currentLeague.id}/auctionState`).update({
                                timeLeft: auctionState.timeLeft - 1
                            });
                        } catch (error) {
                            console.error("Error updating timer:", error);
                        }
                    }
                }, 1000);
                
                return () => clearInterval(timer);
            }, [auctionState.isActive, auctionState.timeLeft, auctionState.currentPlayer, auctionState.currentBidder]);

            const handleNominatePlayer = async () => {
                if (!nominationPlayer || !nominationAmount) {
                    return showMessage("Please select a player and set a starting bid.", "error");
                }
                
                const player = allPlayers.find(p => p.id === nominationPlayer);
                if (!player) return showMessage("Player not found.", "error");
                
                try {
                    await db.doc(`leagues/${currentLeague.id}/auctionState`).set({
                        currentPlayer: player,
                        currentBid: Number(nominationAmount),
                        currentBidder: currentTeam.id,
                        timeLeft: 30,
                        isActive: true,
                        nominatedPlayers: firebase.firestore.FieldValue.arrayUnion(player.id)
                    });
                    
                    setNominationPlayer('');
                    setNominationAmount(1);
                    showMessage(`${player.name} nominated for $${nominationAmount}!`, "success");
                } catch (error) {
                    showMessage("Failed to nominate player.", "error");
                }
            };

            const handlePlaceBid = async () => {
                if (!auctionState.isActive || !currentTeam) return;
                if (bidAmount <= auctionState.currentBid) {
                    return showMessage("Bid must be higher than current bid.", "error");
                }
                
                // Check salary cap
                const currentSalary = Object.values(currentTeam.roster.lineup)
                    .concat(currentTeam.roster.bench)
                    .concat(currentTeam.roster.ir)
                    .filter(p => p)
                    .reduce((sum, pId) => {
                        const player = allPlayers.find(p => p.id === pId);
                        return sum + (player?.salary || 0);
                    }, 0);
                
                const newSalary = currentSalary + bidAmount;
                if (newSalary > currentLeague.settings.teamSalary) {
                    return showMessage(`Bid would exceed salary cap. You have $${currentLeague.settings.teamSalary - currentSalary} remaining.`, "error");
                }
                
                try {
                    await db.doc(`leagues/${currentLeague.id}/auctionState`).update({
                        currentBid: Number(bidAmount),
                        currentBidder: currentTeam.id,
                        timeLeft: 30 // Reset timer
                    });
                    
                    setBidAmount(bidAmount + 1);
                    showMessage(`Bid placed: $${bidAmount}`, "success");
                } catch (error) {
                    showMessage("Failed to place bid.", "error");
                }
            };

            const handleAwardPlayer = async () => {
                if (!auctionState.currentPlayer || !auctionState.currentBidder) return;
                
                const winningTeam = teamsData.find(t => t.id === auctionState.currentBidder);
                if (!winningTeam) return showMessage("Winning team not found.", "error");
                
                try {
                    const batch = db.batch();
                    
                    // Add player to winning team's bench
                    const teamRef = db.doc(`artifacts/${appId}/public/data/teams/${winningTeam.id}`);
                    const updatedRoster = { ...winningTeam.roster };
                    updatedRoster.bench.push(auctionState.currentPlayer.id);
                    
                    batch.update(teamRef, { roster: updatedRoster });
                    
                    // Update league's rostered players
                    const leagueRef = db.doc(`leagues/${currentLeague.id}`);
                    batch.update(leagueRef, {
                        allRosteredPlayerIds: firebase.firestore.FieldValue.arrayUnion(auctionState.currentPlayer.id)
                    });
                    
                    // Advance nomination order
                    const currentIndex = currentLeague.auction?.currentNominationIndex || 0;
                    const nominationOrder = currentLeague.auction?.nominationOrder || [];
                    const nextIndex = (currentIndex + 1) % nominationOrder.length;
                    
                    batch.update(leagueRef, {
                        "auction.currentNominationIndex": nextIndex
                    });
                    
                    // Reset auction state
                    batch.set(db.doc(`leagues/${currentLeague.id}/auctionState`), {
                        currentPlayer: null,
                        currentBid: 0,
                        currentBidder: null,
                        timeLeft: 0,
                        isActive: false,
                        nominatedPlayers: auctionState.nominatedPlayers
                    });
                    
                    await batch.commit();
                    
                    showMessage(`${auctionState.currentPlayer.name} awarded to ${winningTeam.teamName} for $${auctionState.currentBid}!`, "success");
                } catch (error) {
                    showMessage("Failed to award player.", "error");
                }
            };

            const handlePassNomination = async () => {
                if (!canNominate) return;
                
                try {
                    const currentIndex = currentLeague.auction?.currentNominationIndex || 0;
                    const nominationOrder = currentLeague.auction?.nominationOrder || [];
                    const nextIndex = (currentIndex + 1) % nominationOrder.length;
                    
                    await db.doc(`leagues/${currentLeague.id}`).update({
                        "auction.currentNominationIndex": nextIndex
                    });
                    
                    showMessage("Passed nomination turn.", "info");
                } catch (error) {
                    showMessage("Failed to pass nomination.", "error");
                }
            };

            const handleCompleteAuction = async () => {
                const leagueDocRef = db.doc(`leagues/${currentLeague.id}`);
                try {
                    // If there's an active auction, award the current player first
                    if (auctionState.isActive && auctionState.currentPlayer && auctionState.currentBidder) {
                        await handleAwardPlayer();
                    }
                    
                    await leagueDocRef.update({ "auction.status": "complete" });
                    // Clear auction state
                    await db.doc(`leagues/${currentLeague.id}/auctionState`).delete();
                    showMessage("Auction has been completed!", "success");
                } catch(error) {
                    showMessage("Failed to complete auction.", "error");
                }
            };

            const getCurrentNominationTeam = () => {
                if (!currentLeague.auction?.nominationOrder || currentLeague.auction.currentNominationIndex === undefined) return null;
                const teamId = currentLeague.auction.nominationOrder[currentLeague.auction.currentNominationIndex];
                return teamsData.find(t => t.id === teamId);
            };

            const getAvailablePlayers = () => {
                return allPlayers.filter(player => 
                    !auctionState.nominatedPlayers.includes(player.id) &&
                    !currentLeague.allRosteredPlayerIds?.includes(player.id)
                );
            };

            return (
                <div className="p-4 sm:p-6 bg-gray-800 rounded-lg shadow-xl max-w-6xl mx-auto my-8 text-white">
                    <h2 className="text-3xl font-bold text-white mb-6 text-center">Live Auction</h2>
                    
                    {/* Current Auction Status */}
                    <div className="mb-8 p-6 bg-gray-700 rounded-lg">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="text-center">
                                <h3 className="text-xl font-bold text-blue-400 mb-2">Current Player</h3>
                                {auctionState.currentPlayer ? (
                                    <div className="bg-gray-600 p-4 rounded-lg">
                                        <p className="text-lg font-bold">{auctionState.currentPlayer.name}</p>
                                        <p className="text-gray-300">{auctionState.currentPlayer.position} - {auctionState.currentPlayer.nflTeam}</p>
                                        <p className="text-green-400 font-bold">Current Bid: ${auctionState.currentBid}</p>
                                        <p className="text-yellow-400">By: {teamsData.find(t => t.id === auctionState.currentBidder)?.teamName}</p>
                                    </div>
                                ) : (
                                    <p className="text-gray-400">No player currently being auctioned</p>
                                )}
                            </div>
                            
                            <div className="text-center">
                                <h3 className="text-xl font-bold text-green-400 mb-2">Time Remaining</h3>
                                <div className="bg-gray-600 p-4 rounded-lg">
                                    <p className={`text-3xl font-bold ${auctionState.timeLeft <= 10 ? 'text-red-400' : 'text-green-400'}`}>
                                        {auctionState.timeLeft}s
                                    </p>
                                </div>
                            </div>
                            
                            <div className="text-center">
                                <h3 className="text-xl font-bold text-purple-400 mb-2">Next to Nominate</h3>
                                <div className="bg-gray-600 p-4 rounded-lg">
                                    {getCurrentNominationTeam() ? (
                                        <div className="flex items-center justify-center gap-2">
                                            <img src={getCurrentNominationTeam().avatarUrl || "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI0EwQUVCQiI+PHBhdGggZD0iTTEyIDJDNi44OCAyIDIgNi40OCAyIDEyczQuNDggMTAgMTAgMTAgMTAtNC40OCAxMC0xMFMxNy41MiAyIDEyIDJ6bTAgM2MxLjY2IDAgMyAxLjM0IDMgM3MtMS4zNCAzLTMgMy0zLTEuMzQtMy0zIDEuMzQtMyAzLTN6bTAgMTRjLTIuMDMgMC0zLjg0LS44Ny01LjE5LTIuMzJDOC4wMSAxNi4wMSA5LjkyIDE1IDEyIDE1czMuOTkgMS4wMSA1LjE5IDIuNjljLTEuMzYgMS40NC0zLjE2IDIuMzEtNS4xOSAyLjMxeiIvPjwvc3ZnPg=="} alt="Team Avatar" className="w-8 h-8 rounded-full object-cover"/>
                                            <span>{getCurrentNominationTeam().teamName}</span>
                                        </div>
                                    ) : (
                                        <p className="text-gray-400">No nomination order set</p>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Bidding Interface */}
                    {auctionState.isActive && (
                        <div className="mb-8 p-6 bg-gray-700 rounded-lg">
                            <h3 className="text-2xl font-bold text-yellow-400 mb-4">Place Your Bid</h3>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                                <div>
                                    <label className="block text-gray-300 mb-2">Bid Amount ($)</label>
                                    <input 
                                        type="number" 
                                        value={bidAmount} 
                                        onChange={e => setBidAmount(Number(e.target.value))}
                                        min={auctionState.currentBid + 1}
                                        className="w-full p-3 rounded-md bg-gray-600 text-white"
                                    />
                                </div>
                                <div>
                                    <button 
                                        onClick={handlePlaceBid}
                                        disabled={!isMyTurn}
                                        className="w-full px-6 py-3 bg-green-600 hover:bg-green-700 font-bold rounded-md disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        {isMyTurn ? 'Place Bid' : 'Not Your Turn'}
                                    </button>
                                </div>
                                <div className="text-center">
                                    <p className="text-sm text-gray-400">Current High Bid: ${auctionState.currentBid}</p>
                                    <p className="text-sm text-gray-400">By: {teamsData.find(t => t.id === auctionState.currentBidder)?.teamName}</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Nomination Interface */}
                    {canNominate && !auctionState.isActive && (
                        <div className="mb-8 p-6 bg-gray-700 rounded-lg">
                            <h3 className="text-2xl font-bold text-blue-400 mb-4">Nominate a Player</h3>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                                <div>
                                    <label className="block text-gray-300 mb-2">Select Player</label>
                                    <select 
                                        value={nominationPlayer} 
                                        onChange={e => setNominationPlayer(e.target.value)}
                                        className="w-full p-3 rounded-md bg-gray-600 text-white"
                                    >
                                        <option value="">Choose a player...</option>
                                        {getAvailablePlayers().map(player => (
                                            <option key={player.id} value={player.id}>
                                                {player.name} ({player.position} - {player.nflTeam})
                                            </option>
                                        ))}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-gray-300 mb-2">Starting Bid ($)</label>
                                    <input 
                                        type="number" 
                                        value={nominationAmount} 
                                        onChange={e => setNominationAmount(Number(e.target.value))}
                                        min="1"
                                        className="w-full p-3 rounded-md bg-gray-600 text-white"
                                    />
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <button 
                                        onClick={handleNominatePlayer}
                                        disabled={!nominationPlayer}
                                        className="px-6 py-3 bg-blue-600 hover:bg-blue-700 font-bold rounded-md disabled:opacity-50"
                                    >
                                        Nominate Player
                                    </button>
                                    <button 
                                        onClick={handlePassNomination}
                                        className="px-6 py-3 bg-gray-600 hover:bg-gray-700 font-bold rounded-md"
                                    >
                                        Pass Turn
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Nominated Players */}
                    <div className="mb-8 p-6 bg-gray-700 rounded-lg">
                        <h3 className="text-2xl font-bold text-orange-400 mb-4">Nominated Players</h3>
                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            {auctionState.nominatedPlayers.map(playerId => {
                                const player = allPlayers.find(p => p.id === playerId);
                                return player ? (
                                    <div key={playerId} className="bg-gray-600 p-3 rounded-lg">
                                        <p className="font-bold">{player.name}</p>
                                        <p className="text-sm text-gray-300">{player.position} - {player.nflTeam}</p>
                                    </div>
                                ) : null;
                            })}
                        </div>
                        {auctionState.nominatedPlayers.length === 0 && (
                            <p className="text-gray-400 text-center">No players nominated yet.</p>
                        )}
                    </div>

                    {/* Team Rosters and Salary Caps */}
                    <div className="mb-8">
                        <h3 className="text-2xl font-bold text-purple-400 mb-4">Team Status</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {teamsData.map(team => {
                                const currentSalary = Object.values(team.roster.lineup)
                                    .concat(team.roster.bench)
                                    .concat(team.roster.ir)
                                    .filter(p => p)
                                    .reduce((sum, pId) => {
                                        const player = allPlayers.find(p => p.id === pId);
                                        return sum + (player?.salary || 0);
                                    }, 0);
                                const remainingCap = currentLeague.settings.teamSalary - currentSalary;
                                
                                return (
                                    <div key={team.id} className="bg-gray-700 p-4 rounded-lg">
                                        <div className="flex items-center gap-3 mb-2">
                                            <img src={team.avatarUrl || "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI0EwQUVCQiI+PHBhdGggZD0iTTEyIDJDNi44OCAyIDIgNi40OCAyIDEyczQuNDggMTAgMTAgMTAgMTAtNC40OCAxMC0xMFMxNy41MiAyIDEyIDJ6bTAgM2MxLjY2IDAgMyAxLjM0IDMgM3MtMS4zNCAzLTMgMy0zLTEuMzQtMy0zIDEuMzQtMyAzLTN6bTAgMTRjLTIuMDMgMC0zLjg0LS44Ny01LjE5LTIuMzJDOC4wMSAxNi4wMSA5LjkyIDE1IDEyIDE1czMuOTkgMS4wMSA1LjE5IDIuNjljLTEuMzYgMS40NC0zLjE2IDIuMzEtNS4xOSAyLjMxeiIvPjwvc3ZnPg=="} alt="Team Avatar" className="w-8 h-8 rounded-full object-cover"/>
                                            <span className="font-bold">{team.teamName}</span>
                                        </div>
                                        <p className="text-sm text-gray-300">Spent: ${currentSalary.toFixed(2)}</p>
                                        <p className={`text-sm font-bold ${remainingCap < 0 ? 'text-red-400' : 'text-green-400'}`}>
                                            Remaining: ${remainingCap.toFixed(2)}
                                        </p>
                                        <p className="text-xs text-gray-400">Cap: ${currentLeague.settings.teamSalary}</p>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Commissioner Controls */}
                    {isCommissioner && (
                        <div className="text-center">
                            <button onClick={handleCompleteAuction} className="px-6 py-3 bg-red-600 hover:bg-red-700 font-bold rounded-md">
                                Complete Auction (Commissioner)
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const Draft = ({ currentLeague, userId, db, showMessage, teamsData, allPlayers }) => {
            try {
                const [draftDateTime, setDraftDateTime] = useState('');
                const [customDraftOrder, setCustomDraftOrder] = useState([]);
                const [showMockDraft, setShowMockDraft] = useState(false);
                const [mockDraftResults, setMockDraftResults] = useState([]);
                
                // Load existing draft date/time
                useEffect(() => {
                    if (currentLeague?.draft?.scheduledDateTime) {
                        setDraftDateTime(currentLeague.draft.scheduledDateTime);
                    }
                }, [currentLeague?.draft?.scheduledDateTime]);
                
                if (!currentLeague || !teamsData || teamsData.length === 0) {
                    console.log('Draft component - Missing data:', { 
                        currentLeague: !!currentLeague, 
                        teamsData: !!teamsData, 
                        teamsDataLength: teamsData?.length || 0,
                        allPlayersLength: allPlayers?.length || 0
                    });
                    return <div className="p-4 text-center text-white">Loading draft data...</div>;
                }
            
                const isCommissioner = currentLeague.commissionerId === userId;
                const draftType = currentLeague.settings?.draftType || 'auction';

                const handleStartDraft = async () => {
                    if (!isCommissioner) return;
                    showMessage("Draft started!", "success");
                };

                const handleSetDraftDateTime = async () => {
                    if (!draftDateTime) return showMessage("Please select a date and time.", "error");
                    showMessage("Draft date and time set!", "success");
                };

                const handleSetCustomDraftOrder = async () => {
                    if (customDraftOrder.length !== currentLeague.teams.length) {
                        return showMessage("Please select all teams in the desired draft order.", "error");
                    }
                    showMessage("Custom draft order set!", "success");
                };

                const handleRunMockDraft = () => {
                    const mockResults = [];
                    const availablePlayers = [...allPlayers];
                    const teamIds = [...currentLeague.teams];
                    
                    // Simulate draft picks
                    for (let i = 0; i < Math.min(60, availablePlayers.length); i++) {
                        const teamId = teamIds[i % teamIds.length];
                        const team = teamsData.find(t => t.id === teamId);
                        const player = availablePlayers[i];
                        
                        mockResults.push({
                            round: Math.floor(i / teamIds.length) + 1,
                            pick: (i % teamIds.length) + 1,
                            teamId: teamId,
                            teamName: team?.teamName || 'Unknown Team',
                            player: player
                        });
                    }
                    
                    setMockDraftResults(mockResults);
                    setShowMockDraft(true);
                };

                return (
                    <div className="p-4 sm:p-6 bg-gray-800 rounded-lg shadow-xl max-w-4xl mx-auto my-8 text-white">
                        <h2 className="text-3xl font-bold text-white mb-6 text-center">Draft Setup</h2>
                        
                        <div className="mb-8 p-6 bg-gray-700 rounded-lg">
                            <h3 className="text-2xl font-semibold mb-4 text-blue-400">Draft Information</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <h4 className="text-lg font-bold text-green-400">Draft Type</h4>
                                    <p className="text-gray-300 capitalize">{draftType} Draft</p>
                                </div>
                                <div>
                                    <h4 className="text-lg font-bold text-purple-400">Teams</h4>
                                    <p className="text-gray-300">{currentLeague.teams.length} teams</p>
                                </div>
                                <div>
                                    <h4 className="text-lg font-bold text-yellow-400">Draft Order</h4>
                                    <p className="text-gray-300">
                                        {draftType === 'snake' ? 'Snake (1,2,3,4,5,6,6,5,4,3,2,1...)' : 'Standard (same order every round)'}
                                    </p>
                                </div>
                                <div>
                                    <h4 className="text-lg font-bold text-orange-400">Rounds</h4>
                                    <p className="text-gray-300">20 rounds (full roster)</p>
                                </div>
                            </div>
                        </div>

                        {/* Draft Date/Time Setting - Available to all teams */}
                        <div className="p-4 bg-gray-600 rounded-lg mb-6">
                            <h4 className="text-lg font-bold text-blue-400 mb-3">
                                {isCommissioner ? 'Set Draft Date & Time' : 'Draft Date & Time'}
                            </h4>
                            <div className="flex gap-4 items-end">
                                <div className="flex-1">
                                    <label className="block text-gray-300 mb-2">Draft Date & Time</label>
                                    <input 
                                        type="datetime-local" 
                                        value={draftDateTime} 
                                        onChange={e => setDraftDateTime(e.target.value)}
                                        disabled={!isCommissioner}
                                        className="w-full p-3 rounded-md bg-gray-700 text-white disabled:opacity-50"
                                    />
                                </div>
                                {isCommissioner && (
                                    <button 
                                        onClick={handleSetDraftDateTime}
                                        className="px-4 py-3 bg-blue-600 hover:bg-blue-700 rounded-md font-semibold"
                                    >
                                        Set Date/Time
                                    </button>
                                )}
                            </div>
                            {currentLeague.draft?.scheduledDateTime && (
                                <p className="text-green-400 mt-2">
                                    Scheduled: {new Date(currentLeague.draft.scheduledDateTime).toLocaleString()}
                                </p>
                            )}
                            {currentLeague.draft?.customOrder && (
                                <p className="text-purple-400 mt-2">
                                    Custom draft order has been set
                                </p>
                            )}
                        </div>

                        {/* Custom Draft Order - Commissioner Only */}
                        {isCommissioner && (
                            <div className="p-4 bg-gray-600 rounded-lg mb-6">
                                <h4 className="text-lg font-bold text-purple-400 mb-3">Set Custom Draft Order</h4>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                    {teamsData.map((team, index) => (
                                        <div key={team.id} className="flex items-center gap-3">
                                            <span className="text-gray-300 font-semibold">{index + 1}.</span>
                                            <select 
                                                value={customDraftOrder[index] || ''} 
                                                onChange={e => {
                                                    const newOrder = [...customDraftOrder];
                                                    newOrder[index] = e.target.value;
                                                    setCustomDraftOrder(newOrder);
                                                }}
                                                className="flex-1 p-2 rounded-md bg-gray-700 text-white"
                                            >
                                                <option value="">Select team...</option>
                                                {teamsData.map(t => (
                                                    <option key={t.id} value={t.id} disabled={customDraftOrder.includes(t.id) && customDraftOrder[index] !== t.id}>
                                                        {t.teamName}
                                                    </option>
                                                ))}
                                            </select>
                                        </div>
                                    ))}
                                </div>
                                <button 
                                    onClick={handleSetCustomDraftOrder}
                                    className="px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded-md font-semibold"
                                >
                                    Set Custom Order
                                </button>
                            </div>
                        )}

                        {/* Mock Draft - Available to all teams */}
                        <div className="p-4 bg-gray-600 rounded-lg mb-6">
                            <h4 className="text-lg font-bold text-yellow-400 mb-3">Mock Draft</h4>
                            <p className="text-gray-300 mb-4">Run a mock draft to see how the draft might play out.</p>
                            <button 
                                onClick={handleRunMockDraft}
                                className="px-4 py-2 bg-yellow-600 hover:bg-yellow-700 rounded-md font-semibold mr-4"
                            >
                                Run Mock Draft
                            </button>
                            <button 
                                onClick={() => setShowMockDraft(false)}
                                className="px-4 py-2 bg-gray-500 hover:bg-gray-600 rounded-md font-semibold"
                            >
                                Hide Results
                            </button>
                        </div>

                        {/* Start Draft Button - Commissioner Only */}
                        {isCommissioner && (

                        setWaiverClaims(claims);

                return () => unsubscribe();
            }, [db, currentLeague.id]);

            const handlePlaceBid = async () => {
                 if (bidAmount <= selectedPlayer.highestBid) {
                    return showMessage(`Your bid must be higher than the current high bid of $${selectedPlayer.highestBid}.`, "error");
                }
                const waiverRef = db.doc(`leagues/${currentLeague.id}/waivers/${selectedPlayer.id}`);
                try {
                    await waiverRef.update({
                        [`bids.${userId}`]: Number(bidAmount),
                        highestBid: Number(bidAmount),
                        highestBidder: userId
                    });
                    showMessage("Bid placed successfully!", "success");
                    setSelectedPlayer(null);
                } catch(error) {
                    showMessage("Error placing bid.", "error");
                    console.error("Bid error:", error);
                }

            const Countdown = ({ expiration }) => {
                const [timeLeft, setTimeLeft] = useState('');
                useEffect(() => {
                    const interval = setInterval(() => {
                        const now = new Date();
                        const diff = expiration.toDate() - now;
                        if (diff <= 0) {
                            setTimeLeft("Expired");
                            clearInterval(interval);
                            return;
                        }
                        const hours = Math.floor(diff / (1000 * 60 * 60));
                        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                        setTimeLeft(`${hours}h ${minutes}m ${seconds}s`);
                    }, 1000);
                    return () => clearInterval(interval);
                }, [expiration]);
                return <span>{timeLeft}</span>;
            };

            return (

                    </div>

                    {scores.length === 0 && !loading && (
                        <div className="text-center text-gray-400 py-8">

                    {loading && (

                    {/* Cache Status */}

                                </div>

        const App = () => {

            // Debug logging

            const [activeTab, setActiveTab] = useState('leagues');

            const isLoadingData = (currentLeagueId && !currentLeague) || (currentTeamId && !currentTeam);
            const isCommissioner = currentLeague?.commissionerId === userId;

            useEffect(() => {
                if (!db || !currentLeague?.teams) {
                    setTeamsData([]);
                    return;
                };
                
                const unsubscribes = currentLeague.teams.map(teamId => {
                    return db.doc(`artifacts/${appId}/public/data/teams/${teamId}`).onSnapshot(doc => {
                        if (doc.exists) {
                            setTeamsData(prev => {
                                const newTeams = prev.filter(t => t.id !== doc.id);
                                return [...newTeams, { id: doc.id, ...doc.data() }];
                            });
                        }
                    }, error => {
                        console.error("Team data listener error:", error);
                        if (error.code === 'permission-denied') {
                            showMessage("Firebase permission error loading team data.", "error");
                        }
                    });
                });

                return () => unsubscribes.forEach(unsub => unsub());

            }, [db, currentLeague]);

            const showMessage = (msg, type = 'success') => {
                setMessage(msg);
                setMessageType(type);
                setTimeout(() => { setMessage(''); setMessageType(''); }, 4000);
            };

            const handleLeagueSelected = (leagueId, teamId) => {
                setCurrentLeagueId(leagueId);
                setCurrentTeamId(teamId);
                setActiveTab('roster');
            };
            
            const handleLeaveLeague = () => {
                setCurrentLeagueId(null);
                setCurrentTeamId(null);
                setCurrentLeague(null);
                setCurrentTeam(null);
                setActiveTab('leagues');
            };

            useEffect(() => {
                if (!db || !currentLeagueId) {
                    setCurrentLeague(null);
                    return;
                }
                const unsubscribe = db.doc(`leagues/${currentLeagueId}`).onSnapshot(doc => {
                    if (doc.exists) {
                        setCurrentLeague({ id: doc.id, ...doc.data() });
                    } else {
                        // This case is handled by onLeagueDeleted if the commish deletes it
                        // but if it's deleted by other means, this will catch it.
                         if (currentLeagueId) { // only show message if we thought we were in a league
                            handleLeaveLeague();

                    }
                }, (error) => {
                    console.error("Error fetching current league:", error);

                        showMessage("Firebase permission error. Please check if you're logged in.", "error");

                        showMessage("Error loading league data.", "error");

                });
                return () => unsubscribe();
            }, [db, currentLeagueId]);

                    <main>
                        {isLoadingData ? (
                            <div className="flex items-center justify-center pt-20"><div className="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-blue-500"></div></div>
                        ) : (
                            <div>
                                {(() => {
                                    try {
                                        return (
                                            <>
                                                {activeTab === 'leagues' && <LeagueSelector userId={userId} showMessage={showMessage} userDisplayName={userDisplayName} onLeagueSelected={handleLeagueSelected} />}
                                                {activeTab === 'roster' && currentTeam && currentLeague && <Roster teamData={currentTeam} allPlayers={players} showMessage={showMessage} currentLeague={currentLeague} handleLeaveLeague={handleLeaveLeague} onPlayerTransaction={handlePlayerTransaction} currentTeamId={currentTeamId} />}
                                                {activeTab === 'draft-center' && currentLeague && currentTeamId && (
                                                    <div className="p-4 text-white">
                                                        {(() => {
                                                            console.log('App - About to render DraftCenter with:', { currentLeague, teamsData, mockPlayers });
                                                            return <DraftCenter currentLeague={currentLeague} userId={userId} db={db} showMessage={showMessage} teamsData={teamsData} allPlayers={players} />;
                                                        })()}
                                                    </div>
                                                )}
                                                {activeTab === 'standings' && currentLeague && <Standings currentLeague={currentLeague} showMessage={showMessage} db={db} userId={userId} teamsData={teamsData} />}
                                                {activeTab === 'waiver-wire' && currentLeague && <WaiverWire currentLeague={currentLeague} userId={userId} db={db} showMessage={showMessage} teamsData={teamsData} allPlayers={players} />}
                                                {activeTab === 'trade' && currentLeague && currentTeamId && <TradeCenter db={db} userId={userId} showMessage={showMessage} currentLeague={currentLeague} currentTeamId={currentTeamId} teamsData={teamsData} allPlayers={players} />}
                                                {activeTab === 'live-scores' && <LiveScores showMessage={showMessage} />}
                                                {activeTab === 'commissioner' && currentLeague && isCommissioner && <CommissionerTools currentLeague={currentLeague} db={db} showMessage={showMessage} teamsData={teamsData} onLeagueDeleted={handleLeaveLeague} />}
                                            </>
                                        );
                                    } catch (error) {
                                        console.error('Error rendering main content:', error);
                                        return (
                                            <div className="flex items-center justify-center pt-20">
                                                <div className="text-center">
                                                    <h2 className="text-2xl font-bold text-red-400 mb-4">Error Loading Content</h2>
                                                    <p className="text-gray-300 mb-4">There was an error loading the page content.</p>
                                                    <button onClick={() => window.location.reload()} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-md">
                                                        Reload Page
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    }
                                })()}
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const Root = () => {
            console.log('Root component rendering...');
            return (
                <FirebaseProvider>
                    <PlayerProvider>
                        <App />
                    </PlayerProvider>
                </FirebaseProvider>
            );
        };

        try {
            console.log('Starting React app render...');
            console.log('React version:', React.version);
            console.log('ReactDOM version:', ReactDOM.version);
            
            const rootElement = document.getElementById('root');
            if (!rootElement) {
                throw new Error('Root element not found');
            }
            
            console.log('Root element found:', rootElement);
            
            const root = ReactDOM.createRoot(rootElement);
            console.log('React root created');
            
            root.render(<Root />);
            console.log('React app render started successfully');
        } catch (error) {
            console.error('Error rendering app:', error);
            const rootElement = document.getElementById('root');
            if (rootElement) {
                rootElement.innerHTML = `
                    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #111827; color: white; font-family: Arial, sans-serif;">
                        <div style="text-align: center; padding: 2rem;">
                            <h1 style="color: #ef4444; margin-bottom: 1rem;">Error Loading Application</h1>
                            <p style="margin-bottom: 1rem;">There was an error loading the fantasy football application.</p>
                            <p style="color: #9ca3af; font-size: 0.875rem;">Error: ${error.message}</p>
                            <button onclick="location.reload()" style="margin-top: 1rem; padding: 0.5rem 1rem; background: #3b82f6; color: white; border: none; border-radius: 0.375rem; cursor: pointer;">
                                Reload Page
                            </button>
                        </div>
                    </div>
                `;
            }
        }

    </script>
</body>
</html>
