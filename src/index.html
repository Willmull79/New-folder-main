    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #141414; /* charcoal app background */
        }
        /* Simple modal animation */
        .modal-enter {
            opacity: 0;
            transform: scale(0.9);
        }
        .modal-enter-active {
            opacity: 1;
            transform: translateX(0);
            transition: opacity 300ms, transform 300ms;
        }
        /* Styling for the file input button */
        .avatar-upload-btn {
            cursor: pointer;
            position: absolute;
            bottom: 0;
            right: -5px;
            background-color: rgba(30, 41, 59, 0.8); /* bg-slate-800 with opacity */
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #4a5568; /* border-gray-600 */
            transition: background-color 0.2s;
        }
        .avatar-upload-btn:hover {
            background-color: #0ea5e9; /* hover:bg-sky-500 */
        }
    </style>
</head>
<body>
    <noscript>
        <h1>FANTASY DYNASTY LEAGUES</h1>
        <p>Dynasty League football. Fully customizable leagues, starting at only $4 a month or $35 a year - first month free so you can check out the site. You are going to love it. Do everything from this site: IDP leagues, team defense, or both. Roster up to 14 starters or as few as you want - same with the bench. Everything is customizable: salaries, auctions, regular drafts, snake drafts - you name it, we do it. And if we do not, we will create it.</p>
