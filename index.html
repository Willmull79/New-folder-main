                            <div>
                                <h4 className="text-xl font-bold mb-3 text-gray-200 border-b border-gray-600 pb-2">Offense</h4>
                                <div className="grid grid-cols-2 gap-4">
                                    {renderScoringInput('Passing TD', 'passTd')}
                                    {renderScoringInput('Rushing TD', 'rushTd')}
                                    {renderScoringInput('Receiving TD', 'recTd')}
                                    {renderScoringInput('Return TD', 'returnTd')}
                                    {renderScoringInput('2-Point Conv.', 'twoPointConversion')}
                                    {renderScoringInput('Completion', 'completion')}
                                    {renderScoringInput('Passing Yard', 'passYard')}
                                    {renderScoringInput('Rush/Rec Yard', 'rushRecYard')}
                                    {renderScoringInput('Reception (PPR)', 'reception')}
                                    {renderScoringInput('300+ Pass Yd Bonus', 'pass300YardBonus')}
                                    {renderScoringInput('400+ Pass Yd Bonus', 'pass400YardBonus')}
                                    {renderScoringInput('100+ Rush/Rec Yd Bonus', 'rushRec100YardBonus')}
                                    {renderScoringInput('200+ Rush/Rec Yd Bonus', 'rushRec200YardBonus')}
                                    {renderScoringInput('Fumble Recovery', 'fumbleRecovery')}
                                    {renderScoringInput('Sack (QB)', 'sack')}
                                    {renderScoringInput('Interception (QB)', 'interception')}

                            <div>

                                    {renderScoringInput('FG Made (50+ yds)', 'fg50Plus')}
                                    {renderScoringInput('Missed FG/EP', 'missedFgEp')}
                                </div>
                                 <h4 className="text-xl font-bold mb-3 text-gray-200 border-b border-gray-600 pb-2">Defense & ST</h4>
                                <div className="grid grid-cols-2 gap-4">
                                    {renderScoringInput('Tackle (Solo)', 'tackle')}
                                    {renderScoringInput('Assisted Tackle', 'assistedTackle')}
                                    {renderScoringInput('Tackle for Loss', 'tackleForLoss')}
                                    {renderScoringInput('Forced Fumble', 'forcedFumble')}
                                    {renderScoringInput('Fumble Recovery', 'fumbleRecoveryDef')}
                                    {renderScoringInput('Interception', 'interceptionDef')}

        const LeagueSelector = ({ userId, showMessage, userDisplayName, onLeagueSelected }) => {
            const { db } = useFirebase();
            const [joinLeagueId, setJoinLeagueId] = useState('');
            const [isLoadingJoin, setIsLoadingJoin] = useState(false);
            const [userLeagues, setUserLeagues] = useState([]);
            const [isCreatingLeague, setIsCreatingLeague] = useState(false);

            useEffect(() => {
                if (!db || !userId) return;

                const unsubscribe = db.collection("artifacts").doc(appId).collection("public").doc("data").collection("teams")
                    .where("ownerId", "==", userId)
                    .onSnapshot(async (teamSnapshot) => {
                        const leagueIds = new Set();
                        teamSnapshot.forEach(doc => {
                            const teamData = doc.data();
                            if (teamData.leagueId) leagueIds.add(teamData.leagueId);
                        });

                        if (leagueIds.size === 0) {
                            setUserLeagues([]);
                            return;
                        }

                        const leagueDocs = await Promise.all(Array.from(leagueIds).map(id => db.doc(`leagues/${id}`).get()));
                        setUserLeagues(leagueDocs.filter(doc => doc.exists).map(doc => ({ id: doc.id, ...doc.data() })));
                    }, (error) => {
                        console.error("Error fetching user's leagues:", error);
                        showMessage("Error fetching your leagues.", "error");
                    });
                return () => unsubscribe();
            }, [db, userId]);

            const handleJoinLeague = async (leagueIdToJoin) => {
                if (!leagueIdToJoin.trim()) return showMessage("League ID cannot be empty.", "error");
                setIsLoadingJoin(true);
                
                const leagueDocRef = db.doc(`leagues/${leagueIdToJoin}`);
                const teamsCollectionRef = db.collection(`artifacts/${appId}/public/data/teams`);

                try {
                    const leagueDoc = await leagueDocRef.get();
                    if (!leagueDoc.exists) {
                        showMessage("League not found.", "error");
                        setIsLoadingJoin(false);
                        return;
                    }
                    const leagueData = leagueDoc.data();
                    const existingTeamQuery = await teamsCollectionRef.where("ownerId", "==", userId).where("leagueId", "==", leagueIdToJoin).get();

                    if (!existingTeamQuery.empty) {
                        const existingTeamId = existingTeamQuery.docs[0].id;
                        showMessage("You already have a team in this league. Entering now.", "info");
                        onLeagueSelected(leagueIdToJoin, existingTeamId);
                        return;
                    }

                    // Assign to a division round-robin style if divisions exist
                    const divisions = leagueData.settings.divisions || [];
                    let assignedDivision = null;
                    if (divisions.length > 0) {
                        const divisionIndex = leagueData.teams.length % divisions.length;
                        assignedDivision = divisions[divisionIndex];
                    }

                    const initialLineup = {};
                    const startingSlots = leagueData.settings.startingSlots || DEFAULT_STARTING_SLOTS;
                    Object.entries(startingSlots).forEach(([pos, count]) => {
                        for (let i = 1; i <= count; i++) {
                            initialLineup[`${pos}${i}`] = null;
                        }
                    });

                    const newTeamData = {
                        teamName: `${userDisplayName || 'New User'}'s Team`,
                        ownerId: userId,
                        leagueId: leagueIdToJoin,
                        roster: {
                            lineup: initialLineup,
                            bench: [],
                            ir: []
                        },
                        wins: 0, losses: 0, ties: 0,
                    };
                    if (assignedDivision) {
                        newTeamData.division = assignedDivision;
                    }

                    const newTeamRef = await teamsCollectionRef.add(newTeamData);

                    await leagueDocRef.update({
                        teams: firebase.firestore.FieldValue.arrayUnion(newTeamRef.id)
                    });

                    showMessage(`Successfully joined league "${leagueData.name}"!`, "success");
                    onLeagueSelected(leagueIdToJoin, newTeamRef.id);

                } catch (error) {
                    showMessage("Error joining league.", "error");
                    console.error(error);
                } finally {
                    setIsLoadingJoin(false);
                }
            };
            
            if (isCreatingLeague) {
                return <CreateLeagueForm 
                    userId={userId}
                    userDisplayName={userDisplayName}
                    showMessage={showMessage}
                    onLeagueCreated={onLeagueSelected} 
                    onCancel={() => setIsCreatingLeague(false)}

                            <ul className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {userLeagues.map(league => (
                                    <li key={league.id} className="bg-gray-600 p-4 rounded-md flex justify-between items-center">

                                            <p className="text-xs text-gray-400 truncate">ID: {league.id}</p>
                                        </div>

                                ))}
                            </ul>

                    )}

                                Create a League
                            </button>
                        </div>
                        <div className="p-6 bg-gray-700 rounded-lg">
                            <h3 className="text-2xl font-semibold mb-4 text-center">Join Existing League</h3>
                            <input type="text" placeholder="Enter League ID" value={joinLeagueId} onChange={e => setJoinLeagueId(e.target.value)} className="w-full p-3 mb-4 rounded-md bg-gray-600 text-white" />
                            <button onClick={() => handleJoinLeague(joinLeagueId)} disabled={isLoadingJoin} className="w-full px-6 py-3 bg-blue-600 hover:bg-blue-700 font-bold rounded-md disabled:opacity-50">
                                {isLoadingJoin ? 'Joining...' : 'Join League'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const Standings = ({ currentLeague, showMessage, db, userId, teamsData }) => {
            const [activeSubTab, setActiveSubTab] = useState('standings');
            const [leagueTeams, setLeagueTeams] = useState(teamsData);
            const [isSimulating, setIsSimulating] = useState(false);
            const [viewWeek, setViewWeek] = useState(1);
            const isCommissioner = currentLeague.commissionerId === userId;
            const divisions = currentLeague?.settings?.divisions || [];
            const defaultAvatar = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI0EwQUVCQiI+PHBhdGggZD0iTTEyIDJDNi44OCAyIDIgNi40OCAyIDEyczQuNDggMTAgMTAgMTAgMTAtNC40OCAxMC0xMFMxNy41MiAyIDEyIDJ6bTAgM2MxLjY2IDAgMyAxLjM0IDMgM3MtMS4zNCAzLTMgMy0zLTEuMzQtMy0zIDEuMzQtMyAzLTN6bTAgMTRjLTIuMDMgMC0zLjg0LS44Ny01LjE5LTIuMzJDOC4wMSAxNi4wMSA5LjkyIDE1IDEyIDE1czMuOTkgMS4wMSA1LjE5IDIuNjljLTEuMzYgMS40NC0zLjE2IDIuMzEtNS4xOSAyLjMxeiIvPjwvc3ZnPg==";
            const teamsMap = useMemo(() => teamsData.reduce((acc, team) => {
                acc[team.id] = team;
                return acc;
            }, {}), [teamsData]);

            useEffect(() => {
                setLeagueTeams(teamsData);
            }, [teamsData]);

            const onSimulateWeek = async () => {
                if (!currentLeague || !currentLeague.teams || currentLeague.teams.length === 0) {
                    return showMessage("No teams in the league to simulate.", "error");
                }
                
                setIsSimulating(true);
                const batch = db.batch();
                for (const teamId of currentLeague.teams) {
                    const teamDocRef = db.doc(`artifacts/${appId}/public/data/teams/${teamId}`);
                    const outcome = Math.random();
                    if (outcome < 0.4) batch.update(teamDocRef, { wins: firebase.firestore.FieldValue.increment(1) });
                    else if (outcome < 0.8) batch.update(teamDocRef, { losses: firebase.firestore.FieldValue.increment(1) });
                    else batch.update(teamDocRef, { ties: firebase.firestore.FieldValue.increment(1) });
                }

                try {
                    await batch.commit();

                const rotatingTeams = teamIds.slice(1);

                    const firstTeam = teamIds[0];

                    if (matchup.home !== "BYE" && matchup.away !== "BYE") {

            const [timerActive, setTimerActive] = useState(false);

            const [standardDraftTimer, setStandardDraftTimer] = useState(45);
            const [standardTimerActive, setStandardTimerActive] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [searchResults, setSearchResults] = useState([]);
            const [isSearching, setIsSearching] = useState(false);
            const [allNFLPlayers, setAllNFLPlayers] = useState([]);

            // API functions for NFL player data
            const searchNFLPlayers = async (query) => {
                if (!query || query.length < 2) {
                    setSearchResults([]);
                    return;

                    if (window.apiService) {
                        const results = await window.apiService.getESPNPlayerSearch(query);

                            id: player.id,
                            name: player.fullName,
                            position: player.position?.abbreviation || 'N/A',
                            nflTeam: player.team?.abbreviation || 'N/A',

                            rank: 0,
                            jerseyNumber: player.jersey,
                            age: player.age,
                            status: player.status?.description || 'Active'
                        })) || [];
                        
                        setSearchResults(players);
                    } else {
                        // Fallback to mock data if API not available
                        const filteredPlayers = allPlayers.filter(player =>
                            player.name.toLowerCase().includes(query.toLowerCase()) ||
                            player.nflTeam.toLowerCase().includes(query.toLowerCase())
                        );
                        setSearchResults(filteredPlayers);

                        player.nflTeam.toLowerCase().includes(query.toLowerCase())

                    setSearchResults(filteredPlayers);

                    setIsSearching(false);

                            const players = roster.athletes?.map(player => ({

                                name: player.fullName,
                                position: player.position?.abbreviation || 'N/A',
                                nflTeam: player.team?.abbreviation || 'N/A',
                                salary: 0,
                                rank: 0,
                                jerseyNumber: player.jersey,
                                age: player.age,
                                status: player.status?.description || 'Active'
                            })) || [];
                            
                            allPlayers.push(...players);
                        }
                        
                        setAllNFLPlayers(allPlayers);
                    }
                } catch (error) {
                    console.error('Error loading NFL players:', error);
                    // Fallback to mock data
                    setAllNFLPlayers(allPlayers);
                }
            };

            // Timer effect for auction
            useEffect(() => {
                let interval;
                if (timerActive && auctionTimer > 0) {
                    interval = setInterval(() => {
                        setAuctionTimer(prev => {
                            if (prev <= 1) {
                                setTimerActive(false);
                                // Auto-award player if timer runs out
                                if (draftData?.currentPlayer && draftData?.currentBidder) {
                                    handleAwardPlayer();
                                }
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [timerActive, auctionTimer, draftData]);

            // Reset timer when new player is nominated
            useEffect(() => {
                if (draftData?.currentPlayer && draftData?.status === 'live') {
                    setAuctionTimer(20);
                    setTimerActive(true);
                } else {
                    setTimerActive(false);
                    setAuctionTimer(20);
                }
            }, [draftData?.currentPlayer]);

            // Load NFL players on component mount
            useEffect(() => {
                loadAllNFLPlayers();

            // Search players when query changes
            useEffect(() => {
                const timeoutId = setTimeout(() => {
                    if (searchQuery) {
                        searchNFLPlayers(searchQuery);
                    } else {
                        setSearchResults([]);

                }, 300);

                return () => clearTimeout(timeoutId);

            // Fetch draft data
            useEffect(() => {

                const draftRef = db.doc(`leagues/${currentLeague.id}/draft/current`);

                            // Create the draft document if it doesn't exist

                                currentBid: 0,
                                currentBidder: null,

                                draftedPlayers: [],
                                createdAt: new Date(),
                                lastActivity: new Date()
                            }).catch(error => {

                            });

                        setIsLoading(false);
                    },
                    (error) => {
                        console.error("Error fetching draft data:", error);
                        showMessage("Failed to load draft data.", "error");
                        setIsLoading(false);

                return () => unsubscribe();
            }, [currentLeague?.id, db, showMessage]);

                    return showMessage("Database connection not available.", "error");
                }

                try {
                    const draftRef = db.doc(`leagues/${currentLeague.id}/draft/current`);
                    await draftRef.set({
                        type: 'auction',
                        status: 'live',
                        currentPlayer: null,
                        currentBid: 0,
                        currentBidder: null,
                        bidders: [],
                        availablePlayers: allPlayers.map(p => p.id),
                        draftedPlayers: [],
                        startTime: new Date(),
                        lastActivity: new Date()

                    showMessage("Failed to start auction.", "error");

            const handleNominatePlayer = async () => {
                if (!selectedPlayer) {
                    return showMessage("Please select a player to nominate.", "error");

                    return showMessage("Database connection not available.", "error");
                }

                try {
                    const draftRef = db.doc(`leagues/${currentLeague.id}/draft/current`);

                    console.error("Error nominating player:", error);
                    showMessage("Failed to nominate player.", "error");
                }
            };

            // Handle placing bid
            const handlePlaceBid = async () => {
                if (!draftData?.currentPlayer) {
                    return showMessage("No player is currently up for auction.", "error");
                }

                if (currentBid <= draftData.currentBid) {
                    return showMessage("Bid must be higher than current bid.", "error");
                }

                if (!db) {
                    return showMessage("Database connection not available.", "error");
                }

                try {
                    const draftRef = db.doc(`leagues/${currentLeague.id}/draft/current`);
                    await draftRef.update({
                        currentBid: currentBid,

                        teamId: draftData.currentBidder,
                        bid: draftData.currentBid,
                        timestamp: new Date()
                    }];
                    
                    const updatedAvailablePlayers = (draftData.availablePlayers || []).filter(
                        p => p !== draftData.currentPlayer
                    );
                    
                    batch.update(draftRef, {
                        currentPlayer: null,
                        currentBid: 0,
                        currentBidder: null,
                        bidders: [],
                        nominatingTeam: null,
                        draftedPlayers: updatedDraftedPlayers,
                        availablePlayers: updatedAvailablePlayers,
                        lastActivity: new Date()
                    });
                    
                    await batch.commit();
                    setNominatingTeam(null);
                    setTimerActive(false);
                    setAuctionTimer(20);
                    showMessage("Player awarded successfully!", "success");
                } catch (error) {
                    console.error("Error awarding player:", error);
                    showMessage("Failed to award player.", "error");
                }
            };

            // Handle ending auction
            const handleEndAuction = async () => {
                if (!isCommissioner) {
                    return showMessage("Only the commissioner can end the auction.", "error");
                }

                if (!db) {
                    return showMessage("Database connection not available.", "error");
                }

                try {
                    const batch = db.batch();
                    const draftRef = db.doc(`leagues/${currentLeague.id}/draft/current`);
                    const leagueRef = db.doc(`leagues/${currentLeague.id}`);
                    
                    batch.update(draftRef, {
                        status: 'complete',
                        endTime: new Date()
                    });
                    
                    batch.update(leagueRef, {
                        'auction.status': 'complete'
                    });
                    
                    await batch.commit();
                    showMessage("Auction completed!", "success");
                } catch (error) {
                    console.error("Error ending auction:", error);
                    showMessage("Failed to end auction.", "error");
                }
            };

            const isAuctionDraft = true; // This is always an auction
            const isDraftActive = draftData?.status === 'live';

            if (isLoading) {
                return (
                    <div className="p-4 sm:p-6 bg-gray-800 rounded-lg shadow-xl max-w-7xl mx-auto my-8 text-white">
                        <div className="flex items-center justify-center h-64">
                            <div className="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
                            <span className="ml-4 text-lg">Loading auction data...</span>
                        </div>
                    </div>
                );
            }

            return (
                <div className="p-4 sm:p-6 bg-gray-800 rounded-lg shadow-xl max-w-7xl mx-auto my-8 text-white">
                    <h2 className="text-3xl font-bold text-white mb-6 text-center">Live Auction</h2>
                    
                    {/* Auction Status */}
                    <div className="mb-6 p-4 bg-gray-700 rounded-lg">
                        <h3 className="text-xl font-semibold mb-2">Auction Status</h3>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-gray-600 p-3 rounded">
                                <span className="text-gray-300">Type:</span>
                                <span className="ml-2 font-semibold">Auction</span>
                            </div>
                            <div className="bg-gray-600 p-3 rounded">
                                <span className="text-gray-300">Status:</span>
                                <span className={`ml-2 font-semibold ${isDraftActive ? 'text-green-400' : 'text-yellow-400'}`}>
                                    {isDraftActive ? 'Live' : 'Not Started'}
                                </span>
                            </div>
                            <div className="bg-gray-600 p-3 rounded">
                                <span className="text-gray-300">Available Players:</span>
                                <span className="ml-2 font-semibold">{allPlayers.length}</span>
                            </div>
                        </div>
                    </div>

                    {/* Commissioner Controls */}
                    {isCommissioner && !isDraftActive && (
                        <div className="mb-6 p-4 bg-blue-900/20 border border-blue-500 rounded-lg">
                            <h3 className="text-xl font-semibold mb-4 text-blue-400">Commissioner Controls</h3>
                            <div className="flex gap-4">
                                <button
                                    onClick={handleStartAuction}
                                    className="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-md"
                                >
                                    Start Auction
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Active Auction Interface */}
                    {isDraftActive && (
                        <div className="space-y-6">
                            {/* Current Player/Status */}
                            {draftData.currentPlayer && (
                                <div className="p-4 bg-gray-700 rounded-lg">
                                    <h3 className="text-xl font-semibold mb-2">Current Player</h3>
                                    <div className="bg-gray-600 p-3 rounded">
                                        <div className="flex items-center justify-between">
                                            <span className="text-lg font-semibold">
                                                {getPlayerDetails(draftData.currentPlayer, allPlayers)?.name}
                                            </span>
                                            {timerActive && (
                                                <div className={`text-2xl font-bold ${auctionTimer <= 5 ? 'text-red-400' : 'text-green-400'}`}>
                                                    {auctionTimer}s
                                                </div>
                                            )}
                                        </div>
                                        <div className="mt-2">
                                            <span className="text-gray-300">Current Bid: </span>
                                            <span className="font-semibold text-green-400">${draftData.currentBid}</span>
                                            {draftData.currentBidder && (
                                                <span className="ml-4 text-gray-300">
                                                    by {teamsData.find(t => t.id === draftData.currentBidder)?.teamName || 'Unknown Team'}
                                                </span>
                                            )}
                                            {draftData.nominatingTeam && (
                                                <div className="mt-1 text-sm text-blue-300">
                                                    Nominated by: {teamsData.find(t => t.id === draftData.nominatingTeam)?.teamName || 'Unknown Team'}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Auction Actions */}
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                {/* Player Selection */}
                                <div className="p-4 bg-gray-700 rounded-lg">
                                    <h3 className="text-lg font-semibold mb-3">Search & Select Player</h3>
                                    
                                    {/* Search Input */}
                                    <div className="mb-4">
                                        <input
                                            type="text"
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            placeholder="Search for any NFL player..."
                                            className="w-full p-3 bg-gray-600 text-white rounded-md border border-gray-500"
                                        />
                                        {isSearching && (
                                            <div className="mt-2 text-sm text-blue-300">
                                                Searching NFL players...
                                            </div>
                                        )}
                                    </div>

                                    {/* Search Results */}
                                    {searchResults.length > 0 && (
                                        <div className="mb-4 max-h-60 overflow-y-auto">
                                            <h4 className="text-sm font-semibold mb-2 text-gray-300">Search Results:</h4>
                                            <div className="space-y-2">
                                                {searchResults.map(player => (
                                                    <div
                                                        key={player.id}
                                                        onClick={() => setSelectedPlayer(player.id)}
                                                        className={`p-2 rounded cursor-pointer transition-colors ${
                                                            selectedPlayer === player.id 
                                                                ? 'bg-blue-600 text-white' 
                                                                : 'bg-gray-600 hover:bg-gray-500 text-white'
                                                        }`}
                                                    >
                                                        <div className="flex justify-between items-center">
                                                            <span className="font-medium">{player.name}</span>
                                                            <span className="text-sm text-gray-300">
                                                                {player.position} - {player.nflTeam}
                                                            </span>
                                                        </div>
                                                        {player.jerseyNumber && (
                                                            <div className="text-xs text-gray-400">
                                                                #{player.jerseyNumber} • {player.age} years old
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* Available Players Dropdown (Fallback) */}
                                    {searchResults.length === 0 && (
                                        <select
                                            value={selectedPlayer}
                                            onChange={(e) => setSelectedPlayer(e.target.value)}
                                            className="w-full p-3 bg-gray-600 text-white rounded-md border border-gray-500"
                                        >
                                            <option value="">Choose from available players...</option>
                                            {allPlayers.map(player => (
                                                <option key={player.id} value={player.id}>
                                                    {player.name} ({player.position} - {player.nflTeam})
                                                </option>
                                            ))}
                                        </select>
                                    )}

                                    {/* Selected Player Info */}
                                    {selectedPlayer && (
                                        <div className="mt-3 p-3 bg-gray-600 rounded">
                                            <div className="text-sm text-gray-300">Selected:</div>
                                            <div className="font-semibold">
                                                {getPlayerDetails(selectedPlayer, [...allPlayers, ...allNFLPlayers])?.name || 'Unknown Player'}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Action Buttons */}
                                <div className="p-4 bg-gray-700 rounded-lg">
                                    <h3 className="text-lg font-semibold mb-3">Actions</h3>
                                    <div className="space-y-3">
                                        <button
                                            onClick={handleNominatePlayer}
                                            disabled={!selectedPlayer}
                                            className="w-full px-4 py-2 bg-yellow-600 hover:bg-yellow-700 text-white font-semibold rounded-md disabled:opacity-50"
                                        >
                                            Nominate Player
                                        </button>
                                        
                                        {draftData.currentPlayer && (
                                            <>
                                                <div className="flex gap-2">
                                                    <input
                                                        type="number"
                                                        value={currentBid}
                                                        onChange={(e) => setCurrentBid(Number(e.target.value))}
                                                        min={draftData.currentBid + 1}
                                                        className="flex-1 p-2 bg-gray-600 text-white rounded-md border border-gray-500"
                                                        placeholder="Bid amount"
                                                    />
                                                    <button
                                                        onClick={handlePlaceBid}
                                                        disabled={currentBid <= draftData.currentBid}
                                                        className="px-4 py-2 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-md disabled:opacity-50"
                                                    >
                                                        Bid
                                                    </button>
                                                </div>
                                                
                                                {isCommissioner && (
                                                    <button
                                                        onClick={handleAwardPlayer}
                                                        className="w-full px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-md"
                                                    >
                                                        Award Player
                                                    </button>
                                                )}
                                            </>
                                        )}
                                        
                                        {isCommissioner && (
                                            <button
                                                onClick={handleEndAuction}
                                                className="w-full px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-md"
                                            >
                                                End Auction
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Auction History */}
                    {draftData?.draftedPlayers && draftData.draftedPlayers.length > 0 && (
                        <div className="mt-8 p-4 bg-gray-700 rounded-lg">
                            <h3 className="text-xl font-semibold mb-4">Auction History</h3>
                            <div className="max-h-64 overflow-y-auto">
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                                    {draftData.draftedPlayers.map((pick, index) => {
                                        const player = getPlayerDetails(pick.playerId, allPlayers);
                                        const team = teamsData.find(t => t.id === pick.teamId);
                                        return (
                                            <div key={index} className="bg-gray-600 p-3 rounded">
                                                <div className="font-semibold">{player?.name}</div>
                                                <div className="text-sm text-gray-300">
                                                    {team?.teamName || 'Unknown Team'} - ${pick.bid}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const WaiverWire = ({ currentLeague, userId, db, showMessage, teamsData, allPlayers }) => {
            const [waiverClaims, setWaiverClaims] = useState([]);
            const [selectedPlayer, setSelectedPlayer] = useState(null);
            const [bidAmount, setBidAmount] = useState(1);
            
            useEffect(() => {
                if (!db || !currentLeague.id) return;
                const unsubscribe = db.collection(`leagues/${currentLeague.id}/waivers`)
                    .onSnapshot(snapshot => {
                        const claims = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setWaiverClaims(claims);
                    });
                return () => unsubscribe();
            }, [db, currentLeague.id]);

            const handlePlaceBid = async () => {
                 if (bidAmount <= selectedPlayer.highestBid) {
                    return showMessage(`Your bid must be higher than the current high bid of $${selectedPlayer.highestBid}.`, "error");
                }
                const waiverRef = db.doc(`leagues/${currentLeague.id}/waivers/${selectedPlayer.id}`);
                try {
                    await waiverRef.update({
                        [`bids.${userId}`]: Number(bidAmount),
                        highestBid: Number(bidAmount),
                        highestBidder: userId
                    });
                    showMessage("Bid placed successfully!", "success");
                    setSelectedPlayer(null);
                } catch(error) {
                    showMessage("Error placing bid.", "error");
                    console.error("Bid error:", error);
                }
            };

            const Countdown = ({ expiration }) => {
                const [timeLeft, setTimeLeft] = useState('');
                useEffect(() => {
                    const interval = setInterval(() => {
                        const now = new Date();
                        const diff = expiration.toDate() - now;
                        if (diff <= 0) {
                            setTimeLeft("Expired");
                            clearInterval(interval);
                            return;
                        }
                        const hours = Math.floor(diff / (1000 * 60 * 60));
                        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                        setTimeLeft(`${hours}h ${minutes}m ${seconds}s`);
                    }, 1000);
                    return () => clearInterval(interval);
                }, [expiration]);
                return <span>{timeLeft}</span>;
            };

            return (
                <div className="p-4 sm:p-6 bg-gray-800 rounded-lg shadow-xl max-w-4xl mx-auto my-8 text-white">
                    <h2 className="text-3xl font-bold text-white mb-6 text-center">Waiver Wire</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {waiverClaims.map(claim => {
                            const player = getPlayerDetails(claim.playerId, allPlayers);
                            const highBidderTeam = teamsData.find(t => t.id === claim.highestBidder);
                            return (
                                <div key={claim.id} className="bg-gray-700 p-4 rounded-lg">
                                    <h3 className="text-xl font-bold">{player.name}</h3>
                                    <p className="text-gray-400">{player.position} - {player.nflTeam}</p>
                                    <p className="mt-2">High Bid: <span className="font-bold text-green-400">${claim.highestBid}</span></p>
                                    <p className="text-sm text-gray-300">By: {highBidderTeam?.teamName || 'Unknown'}</p>
                                    <p className="mt-2">Time Left: <Countdown expiration={claim.expiration} /></p>
                                    <button onClick={() => { setSelectedPlayer(claim); setBidAmount(claim.highestBid + 0.5); }} className="mt-4 w-full px-4 py-2 bg-blue-600 hover:bg-blue-700 font-semibold rounded-md">Place Bid</button>
                                </div>
                            );
                        })}
                    </div>
                    {waiverClaims.length === 0 && <p className="text-center text-gray-400">No players currently on the waiver wire.</p>}

                    {/* Bidding Modal */}
                    {selectedPlayer && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-md">
                                <h3 className="text-2xl font-bold mb-4">Place Bid for {getPlayerDetails(selectedPlayer.id, allPlayers).name}</h3>
                                <p className="mb-4">Current High Bid: ${selectedPlayer.highestBid}</p>
                                <label className="block">
                                    <span className="text-gray-300">Your Bid ($)</span>
                                    <input type="number" step="0.5" value={bidAmount} onChange={e => setBidAmount(e.target.value)} className="w-full p-3 mt-1 rounded-md bg-gray-700" />
                                </label>
                                <div className="flex justify-end gap-4 mt-6">
                                    <button onClick={() => setSelectedPlayer(null)} className="px-6 py-2 bg-gray-600 hover:bg-gray-500 rounded-md">Cancel</button>
                                    <button onClick={handlePlaceBid} className="px-6 py-2 bg-green-600 hover:bg-green-700 rounded-md">Submit Bid</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const { db, userId, isAuthReady, auth, userDisplayName, userAvatarUrl } = useFirebase();
            const [activeTab, setActiveTab] = useState('leagues');
            const [message, setMessage] = useState('');
            const [messageType, setMessageType] = useState('');
            const [currentLeagueId, setCurrentLeagueId] = useState(null);
            const [currentTeamId, setCurrentTeamId] = useState(null);
            const [currentLeague, setCurrentLeague] = useState(null);
            const [currentTeam, setCurrentTeam] = useState(null);
            const [teamsData, setTeamsData] = useState([]);

            const isLoadingData = (currentLeagueId && !currentLeague) || (currentTeamId && !currentTeam);
            const isCommissioner = currentLeague?.commissionerId === userId;

            useEffect(() => {
                if (!db || !currentLeague?.teams) {
                    setTeamsData([]);
                    return;
                };
                
                const unsubscribes = currentLeague.teams.map(teamId => {
                    return db.doc(`artifacts/${appId}/public/data/teams/${teamId}`).onSnapshot(doc => {
                        if (doc.exists) {
                            setTeamsData(prev => {
                                const newTeams = prev.filter(t => t.id !== doc.id);
                                return [...newTeams, { id: doc.id, ...doc.data() }];
                            });
                        }
                    }, error => console.error("Team data listener error:", error));
                });

                return () => unsubscribes.forEach(unsub => unsub());

            }, [db, currentLeague]);

            const showMessage = (msg, type = 'success') => {
                setMessage(msg);
                setMessageType(type);
                setTimeout(() => { setMessage(''); setMessageType(''); }, 4000);
            };

            const handleLeagueSelected = (leagueId, teamId) => {
                setCurrentLeagueId(leagueId);
                setCurrentTeamId(teamId);
                setActiveTab('roster');
            };
            
            const handleLeaveLeague = () => {
                setCurrentLeagueId(null);
                setCurrentTeamId(null);
                setCurrentLeague(null);
                setCurrentTeam(null);
                setActiveTab('leagues');
            };

            useEffect(() => {
                if (!db || !currentLeagueId) {
                    setCurrentLeague(null);
                    return;
                }
                const unsubscribe = db.doc(`leagues/${currentLeagueId}`).onSnapshot(doc => {
                    if (doc.exists) {
                        setCurrentLeague({ id: doc.id, ...doc.data() });
                    } else {
                        // This case is handled by onLeagueDeleted if the commish deletes it
                        // but if it's deleted by other means, this will catch it.
                         if (currentLeagueId) { // only show message if we thought we were in a league
                            handleLeaveLeague();
                            showMessage("The league you were in no longer exists.", "error");
                        }
                    }
                }, (error) => {
                    console.error("Error fetching current league:", error);
                    showMessage("Error loading league data.", "error");
                });
                return () => unsubscribe();
            }, [db, currentLeagueId]);

            useEffect(() => {
                if (!db || !currentTeamId) {
                    setCurrentTeam(null);
                    return;
                }
                const unsubscribe = db.doc(`artifacts/${appId}/public/data/teams/${currentTeamId}`).onSnapshot(doc => {
                    if (doc.exists) {
                        setCurrentTeam({ id: doc.id, ...doc.data() });
                    } else {
                        // Handled by commissioner deleting the team
                        if (currentTeamId) {
                            handleLeaveLeague();
                            showMessage("Your team in this league was deleted.", "error");
                        }
                    }
                }, (error) => {
                    console.error("Error fetching current team:", error);
                    showMessage("Error loading team data.", "error");
                });
                return () => unsubscribe();
            }, [db, currentTeamId]);

            const handlePlayerTransaction = () => {};

            if (!isAuthReady) {
                return <div className="flex items-center justify-center min-h-screen"><div className="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-blue-500"></div></div>;
            }

            if (!userId) {
                return <AuthScreen showMessage={showMessage} />;
            }
            
            return (
                <div className="min-h-screen text-gray-100 p-4 sm:p-6 lg:p-8">
                    <header className="bg-gray-800 p-4 rounded-lg shadow-md mb-8 flex flex-col sm:flex-row justify-between items-center text-center sm:text-left">
                        <h1 className="text-3xl sm:text-4xl font-extrabold text-blue-400 mb-4 sm:mb-0">Fantasy Dynasty Central</h1>
                        <div className="flex items-center gap-4">
                            <div className="text-right">
                                <span className="text-gray-400 text-sm">Welcome,</span>
                                <p className="font-bold text-blue-300">{userDisplayName || 'User'}</p>
                            </div>
                            <Avatar
                                docRefPath={`artifacts/${appId}/users/${userId}/userProfile/settings`}
                                storagePath={`user-avatars/${userId}`}
                                currentAvatarUrl={userAvatarUrl}
                                showMessage={showMessage}
                                size="h-12 w-12"
                            />
                            <button onClick={() => auth.signOut()} className="px-3 py-1 bg-red-600 hover:bg-red-700 text-white text-sm rounded-md transition duration-200 self-center">Logout</button>
                        </div>
                    </header>

                    {message && <div className={`fixed top-5 right-5 p-4 rounded-lg shadow-lg text-white z-50 ${messageType === 'success' ? 'bg-green-600' : 'bg-red-500'}`}>{message}</div>}

                    <nav className="mb-8 bg-gray-800 p-2 rounded-lg shadow-md">
                        <ul className="flex justify-center flex-wrap gap-2 sm:gap-x-4">
                            {currentLeagueId && currentTeamId ? (
                                <>
                                    <li><button onClick={() => setActiveTab('leagues')} className={`px-3 py-2 text-sm sm:text-base rounded-md font-semibold transition-colors ${activeTab === 'leagues' ? 'bg-blue-600 text-white shadow-lg' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}`}>My Leagues</button></li>
                                    {['Roster', 'Waiver Wire', 'Auction', 'Trade', 'Standings'].map(tab => (
                                        <li key={tab.toLowerCase().replace(' ', '-')}><button onClick={() => setActiveTab(tab.toLowerCase().replace(' ', '-'))} className={`px-3 py-2 text-sm sm:text-base rounded-md font-semibold transition-colors ${activeTab === tab.toLowerCase().replace(' ', '-') ? 'bg-blue-600 text-white shadow-lg' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}`}>{tab}</button></li>
                                    ))}
                                    {isCommissioner && <li><button onClick={() => setActiveTab('commissioner')} className={`px-3 py-2 text-sm sm:text-base rounded-md font-semibold transition-colors ${activeTab === 'commissioner' ? 'bg-purple-600 text-white shadow-lg' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}`}>Commissioner</button></li>}
                                </>
                            ) : (
                                <li><button onClick={() => setActiveTab('leagues')} className={`px-4 py-2 rounded-md font-semibold transition-colors ${activeTab === 'leagues' ? 'bg-blue-600 text-white shadow-lg' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}`}>Select League</button></li>
                            )}
                        </ul>
                    </nav>

                    <main>
                        {isLoadingData ? (
                            <div className="flex items-center justify-center pt-20"><div className="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-blue-500"></div></div>
                        ) : (
                            <>
                                {activeTab === 'leagues' && <LeagueSelector userId={userId} showMessage={showMessage} userDisplayName={userDisplayName} onLeagueSelected={handleLeagueSelected} />}
                                {activeTab === 'roster' && currentTeam && currentLeague && <Roster teamData={currentTeam} allPlayers={mockPlayers} showMessage={showMessage} currentLeague={currentLeague} handleLeaveLeague={handleLeaveLeague} onPlayerTransaction={handlePlayerTransaction} currentTeamId={currentTeamId} />}
                                {activeTab === 'standings' && currentLeague && <Standings currentLeague={currentLeague} showMessage={showMessage} db={db} userId={userId} teamsData={teamsData} />}
                                {activeTab === 'auction' && currentLeague && <Auction currentLeague={currentLeague} userId={userId} db={db} showMessage={showMessage} teamsData={teamsData} />}
                                {activeTab === 'waiver-wire' && currentLeague && <WaiverWire currentLeague={currentLeague} userId={userId} db={db} showMessage={showMessage} teamsData={teamsData} allPlayers={mockPlayers} />}
                                {activeTab === 'trade' && currentLeague && currentTeamId && <TradeCenter db={db} userId={userId} showMessage={showMessage} currentLeague={currentLeague} currentTeamId={currentTeamId} teamsData={teamsData} allPlayers={mockPlayers} />}
                                {activeTab === 'commissioner' && currentLeague && isCommissioner && <CommissionerTools currentLeague={currentLeague} db={db} showMessage={showMessage} teamsData={teamsData} onLeagueDeleted={handleLeaveLeague} />}
                            </>
                        )}
                    </main>
                </div>
            );
        };

        const Root = () => (
            <FirebaseProvider>
                <App />
            </FirebaseProvider>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(<Root />);

    </script>
</body>
</html>
