<body>
    <div id="root"></div>

    <script type="text/babel">
        // =====================================================================================
        // === FIREBASE CONFIGURATION =========================================================
        // =====================================================================================
        // Configuration is loaded from config.js to keep sensitive data separate
        const firebaseConfig = window.FIREBASE_CONFIG;
        const appId = window.APP_ID;

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        // Destructure React hooks for easier use
        const { useState, useEffect, createContext, useContext, useRef, useMemo } = React;

        // =====================================================================================
        // === START OF REACT APPLICATION CODE =================================================
        // =====================================================================================

        const FirebaseContext = createContext(null);

        const FirebaseProvider = ({ children }) => {
            const [db, setDb] = useState(null);
            const [auth, setAuth] = useState(null);
            const [storage, setStorage] = useState(null); // Added storage state
            const [userId, setUserId] = useState(null);
            const [isAuthReady, setIsAuthReady] = useState(false);
            const [userDisplayName, setUserDisplayName] = useState(null);
            const [userAvatarUrl, setUserAvatarUrl] = useState(null); // Added user avatar state

            useEffect(() => {
                const firestoreDb = firebase.firestore();
                const firebaseAuth = firebase.auth();
                const firebaseStorage = firebase.storage(); // Initialize storage
                setDb(firestoreDb);
                setAuth(firebaseAuth);
                setStorage(firebaseStorage); // Set storage

                const unsubscribe = firebaseAuth.onAuthStateChanged(async (user) => {
                    if (user) {
                        setUserId(user.uid);
                        const userProfileDocRef = firestoreDb.doc(`artifacts/${appId}/users/${user.uid}/userProfile/settings`);
                        const docSnap = await userProfileDocRef.get();
                        if (docSnap.exists) {
                            const data = docSnap.data();
                            setUserDisplayName(data.username || user.email || user.uid.substring(0, 6));
                            setUserAvatarUrl(data.avatarUrl || null); // Fetch avatar URL
                        } else {
                            setUserDisplayName(user.email || user.uid.substring(0, 6));
                            setUserAvatarUrl(null);
                        }
                    } else {
                        setUserId(null);
                        setUserDisplayName(null);
                        setUserAvatarUrl(null);
                    }
                    setIsAuthReady(true);
                });

                return () => unsubscribe();
            }, []);

            return (
                <FirebaseContext.Provider value={{ db, auth, storage, userId, isAuthReady, userDisplayName, userAvatarUrl }}>
                    {children}
                </FirebaseContext.Provider>
            );
        };

        const useFirebase = () => useContext(FirebaseContext);

        // --- START: NEW AVATAR COMPONENT ---
        const Avatar = ({ docRefPath, storagePath, currentAvatarUrl, showMessage, size = "h-16 w-16" }) => {
            const { db, storage } = useFirebase();
            const [isUploading, setIsUploading] = useState(false);
            const fileInputRef = useRef(null);

            const handleFileSelect = () => {
                fileInputRef.current.click();
            };

            const handleImageUpload = async (event) => {
                const file = event.target.files[0];
                if (!file) return;

                if (!file.type.startsWith("image/")) {
                    return showMessage("Please select an image file.", "error");
                }
                
                setIsUploading(true);
                const uniqueFileName = `${Date.now()}-${file.name}`;
                const imageRef = storage.ref(`${storagePath}/${uniqueFileName}`);

                try {
                    const snapshot = await imageRef.put(file);
                    const downloadURL = await snapshot.ref.getDownloadURL();
                    
                    const docRef = db.doc(docRefPath);
                    await docRef.update({ avatarUrl: downloadURL });
                    
                    showMessage("Avatar updated successfully!", "success");
                } catch (error) {
                    console.error("Error uploading image:", error);
                    showMessage("Failed to upload avatar.", "error");
                } finally {
                    setIsUploading(false);
                    if(fileInputRef.current) {
                        fileInputRef.current.value = "";
                    }
                }
            };
            
            const defaultAvatar = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI0EwQUVCQiI+PHBhdGggZD0iTTEyIDJDNi44OCAyIDIgNi40OCAyIDEyczQuNDggMTAgMTAgMTAgMTAtNC40OCAxMC0xMFMxNy41MiAyIDEyIDJ6bTAgM2MxLjY2IDAgMyAxLjM0IDMgM3MtMS4zNCAzLTMgMy0zLTEuMzQtMy0zIDEuMzQtMyAzLTN6bTAgMTRjLTIuMDMgMC0zLjg0LS44Ny01LjE5LTIuMzJDOC4wMSAxNi4wMSA5LjkyIDE1IDEyIDE1czMuOTkgMS4wMSA1LjE5IDIuNjljLTEuMzYgMS40NC0zLjE2IDIuMzEtNS4xOSAyLjMxeiIvPjwvc3ZnPg==";


            return (
                <div className={`relative ${size} flex-shrink-0`}>
                    <img
                        src={currentAvatarUrl || defaultAvatar}
                        alt="Avatar"
                        className="rounded-full h-full w-full object-cover border-2 border-gray-600"
                    />
                    {isUploading ? (
                        <div className="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center rounded-full">
                            <div className="animate-spin rounded-full h-6 w-6 border-t-2 border-b-2 border-white"></div>
                        </div>
                    ) : (
                        <>
                            <input
                                type="file"
                                ref={fileInputRef}
                                onChange={handleImageUpload}
                                accept="image/*"
                                className="hidden"
                            />
                            <button onClick={handleFileSelect} title="Change Avatar" className="avatar-upload-btn">
                                ✏️
                            </button>
                        </>
                    )}
                </div>
            );
        };
        // --- END: NEW AVATAR COMPONENT ---

        const mockPlayers = [
            { id: 'p1', name: 'Patrick Mahomes', position: 'QB', nflTeam: 'KC', salary: 50 }, { id: 'p2', name: 'Christian McCaffrey', position: 'RB', nflTeam: 'SF', salary: 55 }, { id: 'p3', name: 'Justin Jefferson', position: 'WR', nflTeam: 'MIN', salary: 52 }, { id: 'p4', name: 'Travis Kelce', position: 'TE', nflTeam: 'KC', salary: 48 }, { id: 'p5', name: 'Myles Garrett', position: 'DL', nflTeam: 'CLE', salary: 30 }, { id: 'p6', name: 'Fred Warner', position: 'LB', nflTeam: 'SF', salary: 28 }, { id: 'p7', name: 'Derwin James', position: 'DB', nflTeam: 'LAC', salary: 25 }, { id: 'p8', name: 'Justin Tucker', position: 'K', nflTeam: 'BAL', salary: 15 }, { id: 'p9', name: 'Josh Allen', position: 'QB', nflTeam: 'BUF', salary: 49 }, { id: 'p10', name: 'Bijan Robinson', position: 'RB', nflTeam: 'ATL', salary: 45 }, { id: 'p11', name: 'Ja\'Marr Chase', position: 'WR', nflTeam: 'CIN', salary: 51 }, { id: 'p12', name: 'T.J. Hockenson', position: 'TE', nflTeam: 'MIN', salary: 35 }, { id: 'p13', name: 'Nick Bosa', position: 'DL', nflTeam: 'SF', salary: 32 }, { id: 'p14', name: 'Roquan Smith', position: 'LB', nflTeam: 'BAL', salary: 29 }, { id: 'p15', name: 'Patrick Surtain II', position: 'DB', nflTeam: 'DEN', salary: 26 }, { id: 'p16', name: 'Tyler Bass', position: 'K', nflTeam: 'BUF', salary: 12 }, { id: 'p17', name: 'Saquon Barkley', position: 'RB', nflTeam: 'PHI', salary: 40 }, { id: 'p18', name: 'CeeDee Lamb', position: 'WR', nflTeam: 'DAL', salary: 48 }, { id: 'p19', name: 'Amon-Ra St. Brown', position: 'WR', nflTeam: 'DET', salary: 47 }, { id: 'p20', name: 'Mark Andrews', position: 'TE', nflTeam: 'BAL', salary: 42 }, { id: 'p21', name: 'Micah Parsons', position: 'LB', nflTeam: 'DAL', salary: 33 }, { id: 'p22', name: 'Jalen Hurts', position: 'QB', nflTeam: 'PHI', salary: 47 }, { id: 'p23', name: 'Austin Ekeler', position: 'RB', nflTeam: 'WAS', salary: 38 }, { id: 'p24', name: 'Cooper Kupp', position: 'WR', nflTeam: 'LAR', salary: 44 }, { id: 'p25', name: 'George Kittle', position: 'TE', nflTeam: 'SF', salary: 40 }, { id: 'p26', name: 'Aaron Donald', position: 'DL', nflTeam: 'LAR', salary: 35 }, { id: 'p27', name: 'Bobby Wagner', position: 'LB', nflTeam: 'WAS', salary: 22 }, { id: 'p28', name: 'Minkah Fitzpatrick', position: 'DB', nflTeam: 'PIT', salary: 27 }, { id: 'p29', name: 'Daniel Carlson', position: 'K', nflTeam: 'LV', salary: 14 }, { id: 'p30', name: 'Derrick Henry', position: 'RB', nflTeam: 'BAL', salary: 39 }, { id: 'p31', name: 'Stefon Diggs', position: 'WR', nflTeam: 'HOU', salary: 46 }, { id: 'p32', name: 'Davante Adams', position: 'WR', nflTeam: 'LV', salary: 45 }, { id: 'p33', name: 'Darren Waller', position: 'TE', nflTeam: 'NYG', salary: 33 }, { id: 'p34', name: 'T.J. Watt', position: 'LB', nflTeam: 'PIT', salary: 34 }, { id: 'p35', name: 'Sauce Gardner', position: 'DB', nflTeam: 'NYJ', salary: 28 }, { id: 'p36', name: 'Dak Prescott', position: 'QB', nflTeam: 'DAL', salary: 45 }, { id: 'p37', name: 'Jonathan Taylor', position: 'RB', nflTeam: 'IND', salary: 42 }, { id: 'p38', name: 'Garrett Wilson', position: 'WR', nflTeam: 'NYJ', salary: 43 }, { id: 'p39', name: 'Puka Nacua', position: 'WR', nflTeam: 'LAR', salary: 30 }, { id: 'p40', name: 'Sam LaPorta', position: 'TE', nflTeam: 'DET', salary: 38 }, { id: 'p41', name: 'Maxx Crosby', position: 'DL', nflTeam: 'LV', salary: 31 }, { id: 'p42', name: 'C.J. Stroud', position: 'QB', nflTeam: 'HOU', salary: 40 }, { id: 'p43', name: 'Kyren Williams', position: 'RB', nflTeam: 'LAR', salary: 36 }, { id: 'p44', name: 'A.J. Brown', position: 'WR', nflTeam: 'PHI', salary: 49 }, { id: 'p46', name: 'Lamar Jackson', position: 'QB', nflTeam: 'BAL', salary: 48 }, { id: 'p47', name: 'Breece Hall', position: 'RB', nflTeam: 'NYJ', salary: 41 }, { id: 'p48', name: 'Tyreek Hill', position: 'WR', nflTeam: 'MIA', salary: 50 }, { id: 'p49', name: 'Joe Burrow', position: 'QB', nflTeam: 'CIN', salary: 48 }
        ];

        const DEFAULT_STARTING_SLOTS = { QB: 1, RB: 2, WR: 3, TE: 1, Flex: 2, DL: 2, LB: 2, DB: 2, DFlex: 1, K: 1 };
        const INITIAL_ROSTER_LIMITS = { Bench: 14, IR: 3 };
        
        const LINEUP_DISPLAY_ORDER = [
            ...Array.from({ length: DEFAULT_STARTING_SLOTS.QB }, (_, i) => `QB${i + 1}`),
            ...Array.from({ length: DEFAULT_STARTING_SLOTS.RB }, (_, i) => `RB${i + 1}`),
            ...Array.from({ length: DEFAULT_STARTING_SLOTS.WR }, (_, i) => `WR${i + 1}`),
            ...Array.from({ length: DEFAULT_STARTING_SLOTS.TE }, (_, i) => `TE${i + 1}`),
            ...Array.from({ length: DEFAULT_STARTING_SLOTS.Flex }, (_, i) => `Flex${i + 1}`),
            ...Array.from({ length: DEFAULT_STARTING_SLOTS.DL }, (_, i) => `DL${i + 1}`),
            ...Array.from({ length: DEFAULT_STARTING_SLOTS.LB }, (_, i) => `LB${i + 1}`),
            ...Array.from({ length: DEFAULT_STARTING_SLOTS.DB }, (_, i) => `DB${i + 1}`),
            ...Array.from({ length: DEFAULT_STARTING_SLOTS.DFlex }, (_, i) => `DFlex${i + 1}`),
            ...Array.from({ length: DEFAULT_STARTING_SLOTS.K }, (_, i) => `K${i + 1}`),
        ];

        const STANDARD_SCORING_RULES = { passTd: 4, rushTd: 6, twoPointConversion: 2, completion: 0.5, passYard: 0.05, pass300YardBonus: 2, pass400YardBonus: 4, sack: -1, interception: -2, fumble: -2, recTd: 6, returnTd: 6, reception: 1, rushRecYard: 0.2, rushRec100YardBonus: 2, rushRec200YardBonus: 4, fumbleRecovery: 1, extraPoint: 1, fg39Less: 3, fg40_49: 4, fg50Plus: 5, missedFgEp: -1, tackle: 2, forcedFumble: 3, fumbleRecoveryDef: 4, interceptionDef: 4, returnYardDefSt: 0.2, passDefended: 0.5, defensiveStTd: 7, assistedTackle: 0.2, tackleForLoss: 1 };

        const getPlayerDetails = (playerId, allPlayers) => allPlayers.find(p => p.id === playerId) || {};
        
        const getAvailablePlayers = (rosteredPlayers, allPlayers) => {
            const allRosteredPlayerIds = new Set(rosteredPlayers);
            return allPlayers.filter(player => !allRosteredPlayerIds.has(player.id));
        };

        const shuffleArray = (array) => {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        };

        const ConfirmationModal = ({ isOpen, onClose, onConfirm, title, children }) => {
            if (!isOpen) return null;

            return (
                 <div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 modal-enter-active">
                    <div className="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-md border border-red-500">
                        <h3 className="text-2xl font-bold mb-4 text-red-400">{title}</h3>
                        <div className="text-gray-300 mb-6">{children}</div>
                        <div className="flex justify-end gap-4">
                            <button onClick={onClose} className="px-6 py-2 bg-gray-600 hover:bg-gray-500 rounded-md font-semibold">Cancel</button>
                            <button onClick={onConfirm} className="px-6 py-2 bg-red-600 hover:bg-red-700 rounded-md font-semibold">Confirm</button>
                        </div>
                    </div>
                </div>
            );
        };
        
        // --- START: COMMISSIONER TOOLS COMPONENT ---
        const CommissionerTools = ({ currentLeague, db, showMessage, teamsData, onLeagueDeleted }) => {
            const [leagueName, setLeagueName] = useState(currentLeague.name);
            const [settings, setSettings] = useState({
                numTeams: 12,
                numWeeks: 14,
                playoffWeeks: 3,
                teamSalary: 1000,
                playersToDrop: 5,
                salaryRaisePercentage: 10,
                minPlayerSalary: 0.5,
                divisions: [],
                rosterLimits: INITIAL_ROSTER_LIMITS, // Now just Bench/IR
                scoringRules: STANDARD_SCORING_RULES,
                ...currentLeague.settings
            });
            
            const [isLoading, setIsLoading] = useState(false);
            const [activeTab, setActiveTab] = useState('settings');
            const [teamToDelete, setTeamToDelete] = useState(null);
            const [showDeleteLeagueModal, setShowDeleteLeagueModal] = useState(false);
            const [deleteConfirmText, setDeleteConfirmText] = useState('');
            const [teamToPromote, setTeamToPromote] = useState(null);

            const isOffSeason = currentLeague.auction?.status !== 'live';

            const handleGeneralSettingChange = (key, value) => {
                setSettings(prev => ({ ...prev, [key]: value }));
            };

            const handleNestedSettingChange = (category, key, value) => {
                setSettings(prev => ({
                    ...prev,
                    [category]: {
                        ...(prev[category] || {}),
                        [key]: value
                    }
                }));
            };
            
            const handleDivisionNameChange = (index, name) => {
                const newDivisions = [...settings.divisions];
                newDivisions[index] = name;
                handleGeneralSettingChange('divisions', newDivisions);
            };

            const addDivision = () => {
                if (settings.divisions.length < 4) {
                    handleGeneralSettingChange('divisions', [...settings.divisions, `Division ${settings.divisions.length + 1}`]);
                }
            };

            const removeDivision = (index) => {
                if (settings.divisions.length > 0) { // Can remove until 0 are left
                    handleGeneralSettingChange('divisions', settings.divisions.filter((_, i) => i !== index));
                }
            };

            const handleUpdateSettings = async () => {
                setIsLoading(true);
                try {
                    const updatedSettings = {
                        ...settings,
                        numTeams: Number(settings.numTeams),
                        numWeeks: Number(settings.numWeeks),
                        playoffWeeks: Number(settings.playoffWeeks),
                        teamSalary: Number(settings.teamSalary),
                        playersToDrop: Number(settings.playersToDrop),
                        salaryRaisePercentage: Number(settings.salaryRaisePercentage),
                        minPlayerSalary: Number(settings.minPlayerSalary),
                    };
                    
                    const updatedData = {
                        name: leagueName,
                        settings: updatedSettings
                    };
                    
                    const leagueRef = db.doc(`leagues/${currentLeague.id}`);
                    await leagueRef.update(updatedData);
                    
                    showMessage("League settings updated successfully!", "success");
                } catch (error) {
                    console.error("Error updating settings:", error);
                    showMessage("Failed to update settings.", "error");
                } finally {
                    setIsLoading(false);
                }
            };
            
            const handleDeleteTeam = async () => {
                if (!teamToDelete) return;
                setIsLoading(true);

                const batch = db.batch();
                const leagueRef = db.doc(`leagues/${currentLeague.id}`);
                const teamRef = db.doc(`artifacts/${appId}/public/data/teams/${teamToDelete.id}`);
                const playersToRemove = Object.values(teamToDelete.roster).flat();

                batch.update(leagueRef, {
                    teams: firebase.firestore.FieldValue.arrayRemove(teamToDelete.id),
                    allRosteredPlayerIds: firebase.firestore.FieldValue.arrayRemove(...playersToRemove)
                });
                batch.delete(teamRef);

                try {
                    const tradesQuery = await db.collection(`leagues/${currentLeague.id}/trades`)
                                                .where('teamIds', 'array-contains', teamToDelete.id)
                                                .get();
                    tradesQuery.forEach(doc => batch.delete(doc.ref));
                    await batch.commit();
                    showMessage(`Team "${teamToDelete.teamName}" has been deleted.`, "success");
                } catch (error) {
                    console.error("Error deleting team:", error);
                    showMessage("Failed to delete team.", "error");
                } finally {
                    setTeamToDelete(null);
                    setIsLoading(false);
                }
            };
            
            const handleDeleteLeague = async () => {
                if (deleteConfirmText !== currentLeague.name) {
                    return showMessage("Confirmation text does not match league name.", "error");
                }
                setIsLoading(true);
                showMessage("Deleting league and all associated data... This may take a moment.", "info");

                try {
                    const batch = db.batch();
                    currentLeague.teams.forEach(teamId => {
                        batch.delete(db.doc(`artifacts/${appId}/public/data/teams/${teamId}`));
                    });
                    const tradesSnapshot = await db.collection(`leagues/${currentLeague.id}/trades`).get();
                    tradesSnapshot.forEach(doc => batch.delete(doc.ref));
                    const waiversSnapshot = await db.collection(`leagues/${currentLeague.id}/waivers`).get();
                    waiversSnapshot.forEach(doc => batch.delete(doc.ref));
                    await batch.commit();
                    await db.doc(`leagues/${currentLeague.id}`).delete();
                    showMessage("League deleted successfully.", "success");
                    onLeagueDeleted();
                } catch (error) {
                    console.error("Error deleting league:", error);
                    showMessage("A critical error occurred during league deletion.", "error");
                    setIsLoading(false);
                }
            };

            const handlePromoteCommissioner = async (team) => {
                if (!team || !team.ownerId) {
                    return showMessage("Invalid team selected.", "error");
                }
                
                setIsLoading(true);
                try {
                    const leagueRef = db.doc(`leagues/${currentLeague.id}`);
                    await leagueRef.update({
                        commissionerId: team.ownerId
                    });
                    
                    showMessage(`${team.teamName} has been promoted to commissioner!`, "success");
                    setTeamToPromote(null);
                } catch (error) {
                    console.error("Error promoting commissioner:", error);
                    showMessage("Failed to promote commissioner.", "error");
                } finally {
                    setIsLoading(false);
                }
            };

            if (!isOffSeason) {
                return (
                    <div className="p-4 sm:p-6 bg-gray-800 rounded-lg shadow-xl max-w-4xl mx-auto my-8 text-white">
                        <h2 className="text-3xl font-bold text-white mb-6 text-center">Commissioner Tools</h2>
                        <div className="bg-yellow-900 border border-yellow-500 text-yellow-300 p-4 rounded-lg text-center">
                            <p className="font-bold text-lg">Tools Locked</p>
                            <p>Major league and team changes can only be made during the off-season (when the auction is not live).</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="p-4 sm:p-6 bg-gray-800 rounded-lg shadow-xl max-w-4xl mx-auto my-8 text-white">
                    <h2 className="text-3xl font-bold text-white mb-6 text-center">Commissioner Tools</h2>
                    <div className="flex border-b border-gray-600 mb-6">
                        <button onClick={() => setActiveTab('settings')} className={`px-4 py-3 font-semibold ${activeTab === 'settings' ? 'border-b-2 border-blue-400 text-white' : 'text-gray-400'}`}>League Settings</button>
                        <button onClick={() => setActiveTab('teams')} className={`px-4 py-3 font-semibold ${activeTab === 'teams' ? 'border-b-2 border-blue-400 text-white' : 'text-gray-400'}`}>Manage Teams</button>
                        <button onClick={() => setActiveTab('commissioner')} className={`px-4 py-3 font-semibold ${activeTab === 'commissioner' ? 'border-b-2 border-purple-400 text-white' : 'text-gray-400'}`}>Commissioner</button>
                        <button onClick={() => setActiveTab('danger')} className={`px-4 py-3 font-semibold ${activeTab === 'danger' ? 'border-b-2 border-red-500 text-red-400' : 'text-gray-400'}`}>Danger Zone</button>
                    </div>

                    {activeTab === 'settings' && (
                        <div>
                            <div className="mb-8 p-4 sm:p-6 bg-gray-700 rounded-lg">
                                <h3 className="text-2xl font-semibold mb-4 text-blue-400">General Settings</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                                    <label className="block sm:col-span-2 md:col-span-3"><span className="text-gray-300">League Name</span><input type="text" value={leagueName} onChange={e => setLeagueName(e.target.value)} className="w-full p-3 mt-1 rounded-md bg-gray-600 text-white" /></label>

                                        <div key={index} className="flex items-center gap-4">

                            <div className="mb-8 p-4 bg-gray-700 rounded-lg">

                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                                    {Object.entries(settings.rosterLimits || INITIAL_ROSTER_LIMITS).map(([pos, val]) => <label key={pos} className="block"><span className="text-gray-300">{pos}</span><input type="number" value={val} onChange={(e) => handleNestedSettingChange('rosterLimits', pos, Number(e.target.value))} className="w-full p-2 mt-1 rounded-md bg-gray-600 text-white"/></label>)}
                                </div>

                            <div className="p-4 bg-gray-700 rounded-lg">
                                <h4 className="text-xl font-semibold mb-3 text-green-400">Scoring Rules</h4>
                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                                    {Object.entries(settings.scoringRules || STANDARD_SCORING_RULES).map(([rule, val]) => <label key={rule} className="block"><span className="text-gray-300">{rule}</span><input type="number" step="0.05" value={val} onChange={(e) => handleNestedSettingChange('scoringRules', rule, Number(e.target.value))} className="w-full p-2 mt-1 rounded-md bg-gray-600 text-white"/></label>)}

                    )}
                    
                    {activeTab === 'teams' && (
                        <div>
                            <h3 className="text-2xl font-semibold mb-4 text-blue-400">Manage Teams</h3>
                            <div className="space-y-4">
                                {teamsData.map(team => (

                                        <div className="flex items-center gap-3">
                                            <img src={team.avatarUrl || "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI0EwQUVCQiI+PHBhdGggZD0iTTEyIDJDNi44OCAyIDIgNi40OCAyIDEyczQuNDggMTAgMTAgMTAgMTAtNC40OCAxMC0xMFMxNy41MiAyIDEyIDJ6bTAgM2MxLjY2IDAgMyAxLjM0IDMgM3MtMS4zNCAzLTMgMy0zLTEuMzQtMy0zIDEuMzQtMyAzLTN6bTAgMTRjLTIuMDMgMC0zLjg0LS44Ny01LjE5LTIuMzJDOC4wMSAxNi4wMSA5LjkyIDE1IDEyIDE1czMuOTkgMS4wMSA1LjE5IDIuNjljLTEuMzYgMS40NC0zLjE2IDIuMzEtNS4xOSAyLjMxeiIvPjwvc3ZnPg=="} alt="Team Avatar" className="w-10 h-10 rounded-full object-cover"/>
                                            <span className="font-semibold">{team.teamName}</span>
                                        </div>
                                        <button onClick={() => setTeamToDelete(team)} disabled={isLoading} className="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-md font-semibold">Delete Team</button>

                        </div>
                    )}

                    {activeTab === 'commissioner' && (
                        <div>

                            <div className="space-y-6">
                                <div className="bg-gray-700 p-4 rounded-lg">
                                    <h4 className="text-lg font-semibold mb-3 text-purple-300">Current Commissioner</h4>
                                    <p className="text-gray-300">You are currently the commissioner of this league.</p>
                                </div>
                                
                                <div className="bg-gray-700 p-4 rounded-lg">
                                    <h4 className="text-lg font-semibold mb-3 text-purple-300">Promote to Commissioner</h4>
                                    <p className="text-gray-300 mb-4">Select a team owner to promote as the new commissioner. This will transfer all commissioner powers to them.</p>
                                    <div className="space-y-3">
                                        {teamsData.filter(team => team.ownerId !== currentLeague.commissionerId).map(team => (
                                            <div key={team.id} className="flex items-center justify-between p-3 bg-gray-600 rounded-lg">
                                                <div className="flex items-center gap-3">
                                                    <img src={team.avatarUrl || "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI0EwQUVCQiI+PHBhdGggZD0iTTEyIDJDNi44OCAyIDIgNi40OCAyIDEyczQuNDggMTAgMTAgMTAgMTAtNC40OCAxMC0xMFMxNy41MiAyIDEyIDJ6bTAgM2MxLjY2IDAgMyAxLjM0IDMgM3MtMS4zNCAzLTMgMy0zLTEuMzQtMy0zIDEuMzQtMyAzLTN6bTAgMTRjLTIuMDMgMC0zLjg0LS44Ny01LjE5LTIuMzJDOC4wMSAxNi4wMSA5LjkyIDE1IDEyIDE1czMuOTkgMS4wMSA1LjE5IDIuNjljLTEuMzYgMS40NC0zLjE2IDIuMzEtNS4xOSAyLjMxeiIvPjwvc3ZnPg=="} alt="Team Avatar" className="w-8 h-8 rounded-full object-cover"/>
                                                    <span className="font-semibold">{team.teamName}</span>
                                                </div>
                                                <button 
                                                    onClick={() => setTeamToPromote(team)}
                                                    className="px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded-md font-semibold"
                                                >
                                                    Promote
                                                </button>
                                            </div>
                                        ))}
                                        {teamsData.filter(team => team.ownerId !== currentLeague.commissionerId).length === 0 && (
                                            <p className="text-gray-400 text-center py-4">No other team owners available to promote.</p>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'danger' && (
                        <div className="p-6 bg-red-900/20 border border-red-500 rounded-lg">
                            <h3 className="text-2xl font-semibold mb-4 text-red-400">Danger Zone</h3>
                            <p className="text-gray-300 mb-6">This action is irreversible and will permanently delete the entire league and all associated teams and data. Please be certain.</p>
                            <button onClick={() => setShowDeleteLeagueModal(true)} className="w-full px-6 py-3 bg-red-600 hover:bg-red-700 font-bold rounded-md">Delete League</button>
                        </div>
                    )}

                    <ConfirmationModal
                        isOpen={!!teamToDelete}
                        onClose={() => setTeamToDelete(null)}
                        onConfirm={handleDeleteTeam}
                        title={`Delete ${teamToDelete?.teamName}?`}
                    >
                        Are you sure you want to delete this team? All of its players will be returned to the free agent pool. This action cannot be undone.
                    </ConfirmationModal>

                    <ConfirmationModal
                        isOpen={showDeleteLeagueModal}
                        onClose={() => { setShowDeleteLeagueModal(false); setDeleteConfirmText(''); }}
                        onConfirm={handleDeleteLeague}
                        title="Permanently Delete League?"
                    >
                        <p className="mb-4">This will delete the league, all teams, all trades, and all history permanently. To confirm, please type the league name below: <strong className="text-yellow-300">{currentLeague.name}</strong></p>
                        <input 
                            type="text" 
                            value={deleteConfirmText}
                            onChange={(e) => setDeleteConfirmText(e.target.value)}
                            className="w-full p-2 rounded-md bg-gray-900 text-white border border-red-400"
                        />
                    </ConfirmationModal>

                    <ConfirmationModal
                        isOpen={!!teamToPromote}
                        onClose={() => setTeamToPromote(null)}
                        onConfirm={() => handlePromoteCommissioner(teamToPromote)}
                        title={`Promote ${teamToPromote?.teamName} to Commissioner?`}
                    >
                        <p className="mb-4">This will transfer all commissioner powers to <strong className="text-purple-300">{teamToPromote?.teamName}</strong>. You will no longer have commissioner access to this league.</p>
                        <p className="text-sm text-gray-400">This action cannot be undone. The new commissioner will have full control over league settings, team management, and draft operations.</p>
                    </ConfirmationModal>
                </div>
            );
        };
        // --- END: COMMISSIONER TOOLS COMPONENT ---

        const TradeCenter = ({ db, userId, showMessage, currentLeague, currentTeamId, teamsData, allPlayers }) => {
            const [view, setView] = useState('pending'); // 'pending' or 'new'
            const [tradePartners, setTradePartners] = useState([currentTeamId]);
            const [tradeAssets, setTradeAssets] = useState({ [currentTeamId]: { players: [] } });
            const [pendingTrades, setPendingTrades] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const salaryCap = currentLeague.settings.teamSalary;

            // Memoize player details map for performance
            const playerDetailsMap = useMemo(() =>
                allPlayers.reduce((acc, player) => {
                    acc[player.id] = player;
                    return acc;
                }, {}), [allPlayers]);
            
            // Memoize team data map for performance
            const teamDataMap = useMemo(() =>
                teamsData.reduce((acc, team) => {
                    acc[team.id] = team;
                    return acc;
                }, {}), [teamsData]);

            // Fetch pending trades
            useEffect(() => {
                const tradesRef = db.collection(`leagues/${currentLeague.id}/trades`);
                const unsubscribe = tradesRef.where('teamIds', 'array-contains', currentTeamId).orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                    const trades = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setPendingTrades(trades);
                    setIsLoading(false);
                }, error => {
                    console.error("Error fetching trades:", error);
                    showMessage("Failed to load trades.", "error");
                    setIsLoading(false);
                });
                return () => unsubscribe();
            }, [db, currentLeague.id, currentTeamId]);

            const resetTrade = () => {
                setTradePartners([currentTeamId]);
                setTradeAssets({ [currentTeamId]: { players: [] } });
            };

            const handlePartnerSelect = (partnerId) => {
                if (!partnerId) return;
                let newPartners;
                if (tradePartners.includes(partnerId)) {
                    newPartners = tradePartners.filter(id => id !== partnerId);
                } else {
                    if (tradePartners.length >= 3) {
                        showMessage("Maximum of 3 teams per trade.", "error");
                        return;
                    }
                    newPartners = [...tradePartners, partnerId];
                }
                setTradePartners(newPartners);
                
                const newAssets = { ...tradeAssets };
                newPartners.forEach(id => {
                    if (!newAssets[id]) newAssets[id] = { players: [] };
                });
                Object.keys(newAssets).forEach(id => {
                    if (!newPartners.includes(id)) delete newAssets[id];
                });
                setTradeAssets(newAssets);
            };

            const handleAssetSelect = (teamId, playerId) => {
                const currentAssets = tradeAssets[teamId]?.players || [];
                const newAssets = { ...tradeAssets };
                if (currentAssets.includes(playerId)) {
                    newAssets[teamId].players = currentAssets.filter(p => p !== playerId);
                } else {
                    newAssets[teamId].players = [...currentAssets, playerId];
                }
                setTradeAssets(newAssets);
            };

            const calculateSalaries = useMemo(() => {
                const results = {};
                tradePartners.forEach(teamId => {
                    const team = teamDataMap[teamId];
                    if (!team) return;

                    const currentRosterPlayers = [ ...Object.values(team.roster.lineup), ...team.roster.bench, ...team.roster.ir ].filter(p => p);
                    const currentSalary = currentRosterPlayers.reduce((sum, pId) => sum + (playerDetailsMap[pId]?.salary || 0), 0);
                    
                    const sendingPlayers = tradeAssets[teamId]?.players || [];
                    const receivingPlayers = Object.entries(tradeAssets)
                        .filter(([id, _]) => id !== teamId)
                        .flatMap(([_, assets]) => assets.players);

                    const salaryOut = sendingPlayers.reduce((sum, pId) => sum + (playerDetailsMap[pId]?.salary || 0), 0);
                    const salaryIn = receivingPlayers.reduce((sum, pId) => sum + (playerDetailsMap[pId]?.salary || 0), 0);
                    
                    const newSalary = currentSalary - salaryOut + salaryIn;
                    results[teamId] = { currentSalary, newSalary, salaryIn, salaryOut };
                });
                return results;
            }, [tradeAssets, tradePartners, teamDataMap, playerDetailsMap]);

            const canProposeTrade = useMemo(() => {
                if (tradePartners.length < 2) return false;
                const totalAssets = Object.values(tradeAssets).flatMap(a => a.players).length;
                if (totalAssets === 0) return false;
                
                // Check for salary cap violations
                return Object.entries(calculateSalaries).every(([_, { newSalary }]) => newSalary <= salaryCap);
            }, [calculateSalaries, tradePartners, salaryCap]);
            
            const handleProposeTrade = async () => {
                if (!canProposeTrade) {
                    return showMessage("Trade is invalid. Check assets and salary caps.", "error");
                }
                setIsLoading(true);
                try {
                    const tradeData = {
                        initiatorId: userId,
                        teamIds: tradePartners,
                        assets: tradeAssets,
                        status: 'pending',
                        acceptances: { [currentTeamId]: true },
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    };
                    await db.collection(`leagues/${currentLeague.id}/trades`).add(tradeData);
                    showMessage("Trade proposed successfully!", "success");
                    setView('pending');
                    resetTrade();
                } catch (error) {
                    console.error("Error proposing trade:", error);
                    showMessage("Failed to propose trade.", "error");
                } finally {
                    setIsLoading(false);
                }
            };

            const handleTradeResponse = async (tradeId, response) => {
                const tradeRef = db.doc(`leagues/${currentLeague.id}/trades/${tradeId}`);
                setIsLoading(true);
                try {
                    if (response === 'accept') {
                        await tradeRef.update({ [`acceptances.${currentTeamId}`]: true });
                        const updatedTradeDoc = await tradeRef.get();
                        const trade = updatedTradeDoc.data();
                        
                        // Check if all parties have accepted
                        const allAccepted = trade.teamIds.every(id => trade.acceptances[id]);
                        
                        if (allAccepted) {
                            await executeTrade(trade, tradeRef);
                        } else {
                            showMessage("Trade accepted. Waiting for other teams.", "success");
                        }
                    } else { // Reject or Cancel
                        await tradeRef.update({ status: response === 'reject' ? 'rejected' : 'canceled' });
                        showMessage(`Trade ${response === 'reject' ? 'rejected' : 'canceled'}.`, "info");
                    }
                } catch (error) {
                    console.error("Error responding to trade:", error);
                    showMessage("An error occurred.", "error");
                } finally {
                    setIsLoading(false);
                }
            };
            
            const executeTrade = async (trade, tradeRef) => {
                showMessage("All teams accepted. Processing trade...", "info");
                const batch = db.batch();

                // Final salary cap check before execution
                for (const teamId of trade.teamIds) {
                    const team = teamDataMap[teamId];
                    const currentSalary = [ ...Object.values(team.roster.lineup), ...team.roster.bench, ...team.roster.ir ].filter(p => p).reduce((sum, pId) => sum + (playerDetailsMap[pId]?.salary || 0), 0);
                    const salaryOut = (trade.assets[teamId]?.players || []).reduce((sum, pId) => sum + (playerDetailsMap[pId]?.salary || 0), 0);
                    const salaryIn = Object.entries(trade.assets)
                        .filter(([id, _]) => id !== teamId)
                        .flatMap(([_, assets]) => assets.players)
                        .reduce((sum, pId) => sum + (playerDetailsMap[pId]?.salary || 0), 0);
                    
                    if (currentSalary - salaryOut + salaryIn > salaryCap) {
                        await tradeRef.update({ status: 'failed_salary_cap' });
                        showMessage(`Trade failed: ${team.teamName} would exceed the salary cap.`, "error");
                        return;
                    }
                }

                // Process roster updates
                trade.teamIds.forEach(teamId => {
                    const teamRef = db.doc(`artifacts/${appId}/public/data/teams/${teamId}`);
                    const team = teamDataMap[teamId];
                    const playersOut = trade.assets[teamId]?.players || [];
                    const playersIn = Object.entries(trade.assets)
                        .filter(([id, _]) => id !== teamId)
                        .flatMap(([_, assets]) => assets.players);
                    
                    let newRoster = JSON.parse(JSON.stringify(team.roster));

                    // Remove players from lineup or bench
                    playersOut.forEach(pId => {
                        Object.keys(newRoster.lineup).forEach(slot => {
                            if (newRoster.lineup[slot] === pId) {
                                newRoster.lineup[slot] = null;
                            }
                        });
                        newRoster.bench = newRoster.bench.filter(benchPId => benchPId !== pId);
                        newRoster.ir = newRoster.ir.filter(irPId => irPId !== pId);
                    });

                    // Add players to bench
                    newRoster.bench = [...newRoster.bench, ...playersIn];
                    
                    batch.update(teamRef, { roster: newRoster });
                });

                // Mark trade as complete
                batch.update(tradeRef, { status: 'completed' });
                
                await batch.commit();
                showMessage("Trade complete! Rosters updated.", "success");
            };

            const renderNewTrade = () => (
                <div className="bg-gray-700 p-6 rounded-lg">
                    <h3 className="text-2xl font-bold text-blue-400 mb-4">Propose a New Trade</h3>
                    {/* Partner Selection */}
                    <div className="mb-6">
                        <h4 className="text-lg font-semibold mb-2">Select Trade Partners (up to 2 others)</h4>
                        <div className="flex flex-wrap gap-2">
                            {teamsData.filter(t => t.id !== currentTeamId).map(team => (
                                <button key={team.id} onClick={() => handlePartnerSelect(team.id)} className={`px-4 py-2 rounded-md font-semibold ${tradePartners.includes(team.id) ? 'bg-green-600' : 'bg-gray-600 hover:bg-gray-500'}`}>
                                    {team.teamName}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Asset Selection */}
                    {tradePartners.length > 1 && (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {tradePartners.map(teamId => {
                                const team = teamDataMap[teamId];
                                const teamPlayers = [ ...Object.values(team.roster.lineup).filter(p => p), ...team.roster.bench, ...team.roster.ir ];
                                return (
                                    <div key={teamId} className="bg-gray-800 p-4 rounded-lg">
                                        <div className="flex items-center gap-3 mb-3 border-b border-gray-600 pb-2">
                                            <img src={team.avatarUrl || "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI0EwQUVCQiI+PHBhdGggZD0iTTEyIDJDNi44OCAyIDIgNi40OCAyIDEyczQuNDggMTAgMTAgMTAgMTAtNC40OCAxMC0xMFMxNy41MiAyIDEyIDJ6bTAgM2MxLjY2IDAgMyAxLjM0IDMgM3MtMS4zNCAzLTMgMy0zLTEuMzQtMy0zIDEuMzQtMyAzLTN6bTAgMTRjLTIuMDMgMC0zLjg0LS44Ny01LjE5LTIuMzJDOC4wMSAxNi4wMSA5LjkyIDE1IDEyIDE1czMuOTkgMS4wMSA1LjE5IDIuNjljLTEuMzYgMS40NC0zLjE2IDIuMzEtNS4xOSAyLjMxeiIvPjwvc3ZnPg=="} alt="Team Avatar" className="w-10 h-10 rounded-full object-cover"/>
                                            <h4 className="text-xl font-bold">{team.teamName}</h4>
                                        </div>
                                        <div className="max-h-60 overflow-y-auto pr-2">
                                        {teamPlayers.length > 0 ? teamPlayers.map(pId => {
                                            const player = playerDetailsMap[pId];
                                            return (
                                                <div key={pId} className="flex items-center justify-between py-1">
                                                    <label className="flex items-center cursor-pointer">
                                                        <input type="checkbox" checked={tradeAssets[teamId]?.players.includes(pId)} onChange={() => handleAssetSelect(teamId, pId)} className="form-checkbox h-5 w-5 bg-gray-700 border-gray-500 rounded text-blue-500 focus:ring-blue-500"/>
                                                        <span className="ml-3">{player.name} (${player.salary})</span>
                                                    </label>
                                                </div>
                                            );
                                        }) : <p className="text-gray-400">No players on roster.</p>}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                    
                    {/* Summary & Propose Button */}
                    {tradePartners.length > 1 && (
                         <div className="mt-8 p-6 bg-gray-800 rounded-lg">
                            <h3 className="text-2xl font-bold text-green-400 mb-4">Trade Summary & Salary Impact</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {Object.entries(calculateSalaries).map(([teamId, data]) => {
                                    const team = teamDataMap[teamId];
                                    const isOverCap = data.newSalary > salaryCap;
                                    return (
                                    <div key={teamId} className={`p-3 rounded ${isOverCap ? 'bg-red-900' : 'bg-gray-700'}`}>

                                                {isUserInitiator && <button onClick={() => handleTradeResponse(trade.id, 'cancel')} disabled={isLoading} className="px-4 py-2 bg-gray-600 hover:bg-gray-500 rounded-md font-semibold">Cancel</button>}

            return (
                 <div className="p-4 sm:p-6 bg-gray-800 rounded-lg shadow-xl max-w-7xl mx-auto my-8 text-white">
                    <h2 className="text-3xl font-bold text-white mb-6 text-center">Trade Center</h2>
                    <div className="flex justify-center border-b border-gray-600 mb-6">

                    {view === 'new' ? renderNewTrade() : renderPendingTrades()}

        };
        
        const Roster = ({ teamData, allPlayers, showMessage, currentLeague, handleLeaveLeague, onPlayerTransaction, currentTeamId }) => {
            const { db } = useFirebase();
            const [newTeamName, setNewTeamName] = useState(teamData.teamName || '');
            const [isSavingTeamName, setIsSavingTeamName] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [bidAmount, setBidAmount] = useState(1);
            const playerSelectRef = useRef(null);
            const rosterLimits = currentLeague?.settings?.rosterLimits || INITIAL_ROSTER_LIMITS;
            const isAuctionComplete = currentLeague?.auction?.status === 'complete';

            useEffect(() => {
                setNewTeamName(teamData.teamName || '');
            }, [teamData.teamName]);

            const handleUpdateTeamName = async () => {
                if (!db || !teamData?.id || !newTeamName.trim()) return showMessage("Team name cannot be empty.", "error");
                
                setIsSavingTeamName(true);
                const teamDocRef = db.doc(`artifacts/${appId}/public/data/teams/${teamData.id}`);
                try {
                    await teamDocRef.update({ teamName: newTeamName.trim() });
                    showMessage("Team name updated successfully!", "success");
                } catch (error) {
                    showMessage("Failed to update team name.", "error");
                } finally {
                    setIsSavingTeamName(false);
                }
            };

            const handlePlaceWaiverBid = async () => {
                if (!isAuctionComplete) {
                    return showMessage("You cannot add free agents until the auction is complete.", "error");
                }
                const playerId = playerSelectRef.current.value;
                if (!playerId) return showMessage("Please select a player.", "error");
                if (bidAmount <= 0) return showMessage("Bid must be greater than zero.", "error");

                const waiverRef = db.collection(`leagues/${currentLeague.id}/waivers`).doc(playerId);

                try {
                    const waiverDoc = await waiverRef.get();
                    if (waiverDoc.exists) {
                        return showMessage("This player is already on the waiver wire. Go to the Waiver Wire tab to bid.", "error");
                    }

                    const expiration = new Date();
                    expiration.setHours(expiration.getHours() + 24);

                    await waiverRef.set({
                        playerId: playerId,
                        bids: {
                            [currentTeamId]: Number(bidAmount)
                        },
                        highestBid: Number(bidAmount),
                        highestBidder: currentTeamId,
                        expiration: firebase.firestore.Timestamp.fromDate(expiration)
                    });

                    showMessage(`You have placed a bid of $${bidAmount} on ${getPlayerDetails(playerId, allPlayers).name}. The 24-hour auction has started.`, "success");
                    setBidAmount(1);

                } catch (error) {
                    showMessage("Error placing waiver bid.", "error");
                    console.error("Waiver bid error:", error);
                }
            };

            const handleRemovePlayer = async (playerId) => {
                if (!db || !teamData?.id) return;
                const playerToRemove = getPlayerDetails(playerId, allPlayers);
                if (!playerToRemove) return showMessage("Player not found.", "error");
                
                try {
                    const batch = db.batch();
                    const teamDocRef = db.doc(`artifacts/${appId}/public/data/teams/${teamData.id}`);
                    
                    const newRoster = JSON.parse(JSON.stringify(teamData.roster));
                    Object.keys(newRoster.lineup).forEach(slot => {
                        if (newRoster.lineup[slot] === playerId) {
                            newRoster.lineup[slot] = null;
                        }
                    });
                    newRoster.bench = newRoster.bench.filter(pId => pId !== playerId);
                    newRoster.ir = newRoster.ir.filter(pId => pId !== playerId);

                    batch.update(teamDocRef, { roster: newRoster });

                    if (currentLeague && currentLeague.id) {
                        const leagueDocRef = db.doc(`leagues/${currentLeague.id}`);
                        batch.update(leagueDocRef, {
                            allRosteredPlayerIds: firebase.firestore.FieldValue.arrayRemove(playerId)
                        });
                    }

                    await batch.commit();
                    showMessage(`${playerToRemove.name} dropped from your roster.`, "success");
                    onPlayerTransaction();
                } catch (error) {
                    showMessage("Error dropping player.", "error");
                    console.error("Error dropping player:", error);
                }
            };

            const handleMovePlayer = async (playerId, from, to) => {
                const newRoster = JSON.parse(JSON.stringify(teamData.roster));

                // Remove player from original spot
                if (from === 'bench') newRoster.bench = newRoster.bench.filter(pId => pId !== playerId);
                else if (from === 'ir') newRoster.ir = newRoster.ir.filter(pId => pId !== playerId);
                else newRoster.lineup[from] = null;

                // Add player to new spot
                if (to === 'bench') newRoster.bench.push(playerId);
                else if (to === 'ir') newRoster.ir.push(playerId);
                else newRoster.lineup[to] = playerId;

                try {
                    const teamDocRef = db.doc(`artifacts/${appId}/public/data/teams/${teamData.id}`);
                    await teamDocRef.update({ roster: newRoster });
                    showMessage("Roster updated.", "success");
                } catch(error) {
                    showMessage("Failed to update roster.", "error");
                }
            };

            const getEligibleSlotsForPlayer = (playerId) => {
                const playerDetails = getPlayerDetails(playerId, allPlayers);
                if (!playerDetails) return [];

                const pos = playerDetails.position;
                const emptySlots = Object.keys(teamData.roster.lineup).filter(slot => teamData.roster.lineup[slot] === null);
                
                return emptySlots.filter(slotKey => {
                    const slotPosition = slotKey.replace(/[0-9]/g, ''); // "RB1" -> "RB"
                    if (slotPosition === pos) return true;
                    if (slotPosition === 'Flex' && ['RB', 'WR', 'TE'].includes(pos)) return true;
                    if (slotPosition === 'DFlex' && ['DL', 'LB', 'DB'].includes(pos)) return true;
                    return false;
                });
            };

            const availablePlayers = getAvailablePlayers(currentLeague ? currentLeague.allRosteredPlayerIds : [], allPlayers)
                                             .filter(player => player.name.toLowerCase().includes(searchQuery.toLowerCase()));

            const PlayerActions = ({ playerId, from }) => {
                const [showDropdown, setShowDropdown] = useState(false);
                const eligibleSlots = getEligibleSlotsForPlayer(playerId);

                if (from === 'bench' || from === 'ir') {
                    if (eligibleSlots.length === 0) {
                        return <span className="text-xs text-gray-500">No open slots</span>;
                    }
                    return (
                        <div className="relative">
                            <button onClick={() => setShowDropdown(!showDropdown)} className="px-3 py-1 bg-green-600 hover:bg-green-700 text-white text-sm rounded-md">Start</button>
                            {showDropdown && (
                                <div className="absolute right-0 mt-2 w-48 bg-gray-600 rounded-md shadow-lg z-10">
                                    {eligibleSlots.map(slot => (
                                        <a key={slot} href="#" onClick={() => { handleMovePlayer(playerId, from.toLowerCase(), slot); setShowDropdown(false); }} className="block px-4 py-2 text-sm text-gray-200 hover:bg-blue-500">
                                            Move to {slot.replace(/(\d+)/, ' $1')}
                                        </a>
                                    ))}
                                </div>
                            )}
                        </div>
                    );
                } else { // It's a lineup slot
                    return <button onClick={() => handleMovePlayer(playerId, from, 'bench')} className="px-3 py-1 bg-yellow-600 hover:bg-yellow-700 text-white text-sm rounded-md">Bench</button>;
                }
            };
            
            return (
                <div className="p-4 sm:p-6 bg-gray-800 rounded-lg shadow-xl max-w-7xl mx-auto my-8 text-white">
                    <div className="flex flex-col sm:flex-row items-center gap-6 mb-6">
                        <Avatar
                            docRefPath={`artifacts/${appId}/public/data/teams/${teamData.id}`}
                            storagePath={`team-avatars/${teamData.id}`}
                            currentAvatarUrl={teamData.avatarUrl}
                            showMessage={showMessage}
                            size="h-24 w-24"
                        />
                        <div className="flex-grow w-full">
                            <h2 className="text-3xl font-bold text-white mb-2 text-center sm:text-left">Your Roster</h2>
                            <div className="p-4 bg-gray-700 rounded-lg shadow-inner flex flex-col sm:flex-row items-center justify-between gap-4">
                                <label className="block flex-grow w-full">
                                    <span className="text-gray-300 text-lg font-semibold">Team Name:</span>
                                    <input type="text" value={newTeamName} onChange={(e) => setNewTeamName(e.target.value)} className="w-full p-2 rounded-md bg-gray-600 text-white border border-gray-500 focus:ring-blue-500 focus:border-blue-500 mt-1" />
                                </label>
                                <button onClick={handleUpdateTeamName} disabled={isSavingTeamName} className="w-full sm:w-auto px-6 py-2 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-md shadow-lg transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                                    {isSavingTeamName ? 'Saving...' : 'Save Name'}
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-8">
                        <div>
                             <h3 className="text-2xl font-bold text-blue-400 mb-4">Starting Lineup</h3>
                             <div className="space-y-2">
                                {teamData.roster.lineup && LINEUP_DISPLAY_ORDER.map(slot => {
                                    const playerId = teamData.roster.lineup[slot];
                                    const player = playerId ? getPlayerDetails(playerId, allPlayers) : null;
                                    return (
                                        <div key={slot} className="bg-gray-700 p-3 rounded-md flex items-center justify-between">
                                            <div className="flex items-center gap-4 truncate">
                                                <span className="font-bold text-blue-300 w-16 flex-shrink-0">{slot.replace(/(\d+)/, ' $1')}</span>
                                                {player ? (
                                                     <span className="truncate">{player.name} ({player.position}) - ${player.salary}</span>
                                                ) : (
                                                    <span className="text-gray-500">-- Empty --</span>
                                                )}
                                            </div>
                                            <div className="flex items-center gap-2 flex-shrink-0">
                                                {player && <PlayerActions playerId={playerId} from={slot} />}
                                                {player && <button onClick={() => handleRemovePlayer(playerId)} className="px-3 py-1 bg-red-600 hover:bg-red-700 text-white text-sm rounded-md">Drop</button>}
                                            </div>
                                        </div>
                                    );
                                })}
                             </div>
                        </div>
                        <div className="space-y-6">
                            <div>
                                <h3 className="text-2xl font-bold text-purple-400 mb-4">Bench</h3>
                                <div className="space-y-2">
                                    {Array.from({ length: rosterLimits.Bench }).map((_, index) => {
                                        const playerId = teamData.roster.bench[index];
                                        const player = playerId ? getPlayerDetails(playerId, allPlayers) : null;
                                        return (
                                            <div key={`bench-${index}`} className="bg-gray-700 p-3 rounded-md flex items-center justify-between h-[50px]">
                                                <div className="flex items-center gap-4 truncate">
                                                    <span className="font-bold text-purple-300 w-20 flex-shrink-0">{`Bench ${index + 1}`}</span>
                                                    {player ? (
                                                        <span className="truncate">{player.name} ({player.position}) - ${player.salary}</span>
                                                    ) : (
                                                        <span className="text-gray-500">-- Empty --</span>
                                                    )}
                                                </div>
                                                {player && (
                                                    <div className="flex items-center gap-2 flex-shrink-0">
                                                       <PlayerActions playerId={playerId} from="bench" />
                                                       <button onClick={() => handleRemovePlayer(playerId)} className="px-3 py-1 bg-red-600 hover:bg-red-700 text-white text-sm rounded-md">Drop</button>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                             <div>
                                <h3 className="text-2xl font-bold text-red-400 mb-4">Injured Reserve</h3>
                                 <div className="space-y-2">
                                    {Array.from({ length: rosterLimits.IR }).map((_, index) => {
                                        const playerId = teamData.roster.ir[index];
                                        const player = playerId ? getPlayerDetails(playerId, allPlayers) : null;
                                        return (
                                            <div key={`ir-${index}`} className="bg-gray-700 p-3 rounded-md flex items-center justify-between h-[50px]">
                                                <div className="flex items-center gap-4 truncate">
                                                    <span className="font-bold text-red-300 w-20 flex-shrink-0">{`IR ${index + 1}`}</span>
                                                    {player ? (
                                                        <span className="truncate">{player.name} ({player.position}) - ${player.salary}</span>
                                                    ) : (
                                                        <span className="text-gray-500">-- Empty --</span>
                                                    )}
                                                </div>
                                                {player && (
                                                    <div className="flex items-center gap-2 flex-shrink-0">
                                                       <PlayerActions playerId={playerId} from="ir" />
                                                       <button onClick={() => handleRemovePlayer(playerId)} className="px-3 py-1 bg-red-600 hover:bg-red-700 text-white text-sm rounded-md">Drop</button>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div className="mt-8 p-4 sm:p-6 bg-gray-700 rounded-lg shadow-inner">
                        <h3 className="text-xl font-semibold text-white mb-4">Claim Player from Free Agency (Waiver Wire)</h3>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <label className="block col-span-full md:col-span-2">
                                <span className="text-gray-300">Select Player:</span>
                                <select id="player-select" ref={playerSelectRef} className="w-full p-2 rounded-md bg-gray-600 text-white border border-gray-500 focus:ring-blue-500 focus:border-blue-500">
                                    <option value="">Select a player...</option>
                                    {availablePlayers.length > 0 ? (
                                        availablePlayers.map(player => (
                                            <option key={player.id} value={player.id}>{player.name} ({player.position} - {player.nflTeam})</option>
                                        ))
                                    ) : (
                                        <option disabled>No players available</option>
                                    )}
                                </select>
                            </label>
                             <label className="block">
                                <span className="text-gray-300">Bid Amount ($)</span>
                                <input type="number" step="0.5" min="0.5" value={bidAmount} onChange={e => setBidAmount(e.target.value)} className="w-full p-2 rounded-md bg-gray-600 text-white border border-gray-500" />
                            </label>
                            <button 
                                onClick={handlePlaceWaiverBid} 
                                className="col-span-full px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-md shadow-lg transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                                disabled={!isAuctionComplete}
                            >
                                {isAuctionComplete ? 'Place Bid & Start Auction' : 'Auction Not Complete'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const AuthScreen = ({ showMessage }) => {
            const { auth, db } = useFirebase();
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [username, setUsername] = useState('');
            const [isLoading, setIsLoading] = useState(false);

            const handleAuthAction = async () => {
                if (!auth || !db) return showMessage("Firebase not initialized.", "error");
                
                // Validation
                if (!email.trim()) {
                    showMessage("Email cannot be empty.", "error");
                    return;
                }
                if (!password.trim()) {
                    showMessage("Password cannot be empty.", "error");
                    return;
                }
                if (!isLogin && !username.trim()) {
                    showMessage("Name cannot be empty.", "error");
                    return;
                }
                if (password.length < 6) {
                    showMessage("Password must be at least 6 characters long.", "error");
                    return;
                }

                // reCAPTCHA verification
                const recaptchaToken = grecaptcha.getResponse();
                if (!recaptchaToken) {
                    showMessage("Please complete the reCAPTCHA verification.", "error");
                    return;
                }
                
                setIsLoading(true);
                try {
                    if (isLogin) {
                        await auth.signInWithEmailAndPassword(email, password);
                        showMessage("Logged in successfully!", "success");
                    } else {
                        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                        const userProfileDocRef = db.doc(`artifacts/${appId}/users/${userCredential.user.uid}/userProfile/settings`);
                        await userProfileDocRef.set({ username }, { merge: true });
                        showMessage("Registered successfully!", "success");
                    }
                    // Reset reCAPTCHA after successful authentication
                    grecaptcha.reset();
                } catch (error) {
                    console.error("Auth error:", error);
                    let errorMessage = "An error occurred during authentication.";
                    
                    if (error.code === 'auth/email-already-in-use') {
                        errorMessage = "An account with this email already exists. Please login instead.";
                    } else if (error.code === 'auth/invalid-email') {
                        errorMessage = "Please enter a valid email address.";
                    } else if (error.code === 'auth/weak-password') {
                        errorMessage = "Password should be at least 6 characters long.";
                    } else if (error.code === 'auth/user-not-found') {
                        errorMessage = "No account found with this email. Please register first.";
                    } else if (error.code === 'auth/wrong-password') {
                        errorMessage = "Incorrect password. Please try again.";
                    } else if (error.code === 'auth/too-many-requests') {
                        errorMessage = "Too many failed attempts. Please try again later.";
                    } else if (error.message) {
                        errorMessage = error.message;
                    }
                    
                    showMessage(errorMessage, "error");
                    // Reset reCAPTCHA on error
                    grecaptcha.reset();
                } finally {
                    setIsLoading(false);
                }
            };

            return (

        const CreateLeagueForm = ({ userId, userDisplayName, showMessage, onLeagueCreated, onCancel }) => {

            const handleScoringChange = (rule, value) => {

            const handleDivisionNameChange = (index, name) => {
                const newDivisions = [...divisions];

            const addDivision = () => {
                if (divisions.length < 4) {

            const removeDivision = (index) => {
                if (divisions.length > 2) {

            const handleCreateLeague = async () => {
                if (!leagueName.trim()) return showMessage("League name cannot be empty.", "error");

                setIsLoading(true);

                    // Generate the initial lineup structure with null values
                    const initialLineup = {};
                    Object.entries(DEFAULT_STARTING_SLOTS).forEach(([pos, count]) => {
                        for (let i = 1; i <= count; i++) {
                            initialLineup[`${pos}${i}`] = null;
                        }

                    await newLeagueRef.set({
                        name: leagueName.trim(),
                        commissionerId: userId,

                    const commissionerTeamData = {

                            <label className="block"><span className="text-gray-300">Team Salary Cap</span><input type="number" max="5000" value={teamSalary} onChange={e => setTeamSalary(e.target.value)} className="w-full p-3 mt-1 rounded-md bg-gray-600 text-white" /></label>
                            <label className="block"><span className="text-gray-300">Players to Drop</span><input type="number" value={playersToDrop} onChange={e => setPlayersToDrop(e.target.value)} className="w-full p-3 mt-1 rounded-md bg-gray-600 text-white" /></label>

                            <label className="block"><span className="text-gray-300">Min Player Salary</span><input type="number" value={minPlayerSalary} onChange={e => setMinPlayerSalary(e.target.value)} min="0.5" max="10" step="0.01" className="w-full p-3 mt-1 rounded-md bg-gray-600 text-white" /></label>
                            <div className="sm:col-span-2 md:col-span-3">

                                    />
                                    <span className="text-gray-300">Enable Divisions</span>

                    </div>

                    {divisionsEnabled && (

                                {divisions.map((division, index) => (
                                    <div key={index} className="flex items-center gap-4">
                                        <input type="text" value={division.name} onChange={(e) => handleDivisionNameChange(index, e.target.value)} className="w-full p-2 rounded-md bg-gray-600 text-white" />
                                        {divisions.length > 2 && <button onClick={() => removeDivision(index)} className="px-3 py-2 bg-red-600 hover:bg-red-700 rounded-md">-</button>}
                                    </div>

                            {divisions.length < 4 && <button onClick={addDivision} className="mt-4 px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-md">Add Division</button>}
                        </div>
                    )}

                    <div className="mb-8 p-4 sm:p-6 bg-gray-700 rounded-lg">
                        <h3 className="text-2xl font-semibold mb-4 text-purple-400">Roster Limits</h3>
                        <p className="text-sm text-gray-400 mb-4">Set the maximum number of players for non-starter positions.</p>
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                           {Object.keys(rosterLimits).map(pos => (
                               <label key={pos} className="block"><span className="text-gray-300">{pos}</span><input type="number" value={rosterLimits[pos]} onChange={e => setRosterLimits(prev => ({...prev, [pos]: Number(e.target.value)}))} className="w-full p-2 mt-1 rounded-md bg-gray-600 text-white"/></label>
                           ))}
                        </div>
                    </div>

                    <div className="mb-8 p-4 sm:p-6 bg-gray-700 rounded-lg">
                        <h3 className="text-2xl font-semibold mb-4 text-green-400">Scoring Rules</h3>
